<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>마이 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 값은 Figma 변수와 마이 A(2508:25034 인증 전 / 2508:25104 인증 후), 설정 드로어(2639:29714·29784)에서 가져옴 */
:root {
  --text-primary: #18181b;
  --text-secondary: #3f3f47;
  --text-teritary: #71717b;
  --text-disable: #d4d4d8;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --bg-teritary: #f0f0f3;
  --notice: #fb2c36;
  --avatar: #f0f0f3;
  --r12: 12px; --r20: 20px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --pad: 20px;
  color-scheme: light;
}
@media (min-width: 768px)  { :root { --pad: 32px; } }
@media (min-width: 1100px) { :root { --pad: 48px; } }

*, *::before, *::after { box-sizing: border-box; letter-spacing: -0.03em; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--border-primary) transparent; scrollbar-width: thin; }
body { margin: 0; background: #fff; color: var(--text-primary); font: 500 12px/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; padding-bottom: 150px; }
body.lock { overflow: hidden; }
::selection { background: var(--text-primary); color: #fff; }
a { color: inherit; text-decoration: none; }
button { font: inherit; letter-spacing: -0.03em; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
img { display: block; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.dark :focus-visible, .nav :focus-visible { outline-color: #fafafa; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; z-index: 90; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; background: var(--text-primary); color: #fff; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: top .2s var(--ease); }
.skip:focus-visible { top: 8px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.wrap { width: 100%; max-width: 1320px; margin-inline: auto; padding-inline: var(--pad); }
[hidden] { display: none !important; }

/* 구성 */
.layout { padding-top: max(12px, env(safe-area-inset-top)); }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); column-gap: 64px; align-items: start; padding-top: 32px; }
  .side { position: sticky; top: 24px; }
}

/* 상단: 프로필 + 알림함·설정 */
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.me { display: flex; align-items: center; gap: 8px; min-width: 0; }   /* 11-07: 사진 36 + 닉네임 18, 화살표 없음(기본 프로필 수정은 햄버거) */
.avatar { position: relative; width: 36px; height: 36px; border-radius: 9999px; background: var(--avatar); display: grid; place-items: end center; overflow: hidden; color: #fff; flex: none; }
.avatar svg { position: absolute; left: 13.44%; top: 19.54%; width: 74.38%; height: 82.34%; }   /* 11-09 Figma `Avatar / 프로필 (무채색)` 3570:40023 비율(폭 74.4%·왼쪽 13.4%·위 19.5%) — 36·48 모두 같음, 팀원 목록·댓글 등 작은 아바타도 같은 그림 */
/* 11-09 날짜 글자: Figma `body/md/regular2`(12, 500, 자간 +1%)·`body/lg/regular2`(14, 400, 자간 0) — 숫자가 붙어 보이지 않게 기본 자간(-3%)을 쓰지 않음 */
.dt12 { font-weight: 500; letter-spacing: 0.01em; }
.dt14 { font-weight: 400; letter-spacing: 0; }
.avlink { flex: none; display: block; padding: 4px; margin: -4px; border-radius: 9999px; }   /* 11-09 프로필 사진을 누르면 기본 프로필 수정 — 보이는 36, 누르는 영역 44 */
.avlink .avatar { transition: transform .16s var(--ease, ease); }
.avlink:active .avatar { transform: scale(.96); }
.avlink:focus-visible { outline: 2px solid var(--text-primary); outline-offset: -2px; }
.avatar::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px var(--border-primary); pointer-events: none; }   /* 흰 몸통이 바탕에 묻혀 반달처럼 보이던 것 → 원 윤곽 살림 */
.me b { display: block; font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me small { display: block; color: var(--text-teritary); font-size: 12px; font-weight: 500; }
.tools { display: flex; gap: 0; margin-right: -10px; flex: none; }   /* 알약 배경 없이 아이콘만 */
.tool { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9999px; transition: background .2s; }
@media (hover: hover) { .tool:hover { background: var(--bg-secondary); } }
.tool .i { width: 24px; height: 24px; }
.tool .dot { position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 9999px; background: var(--notice); border: 2px solid #fff; box-sizing: content-box; }

/* 작가 카드 (검정, 인증 후에만) — 11-07 D안 확정: 사진·구분선·원형 화살표 없이 이름 + 분야·수치 + "작가 프로필 ›" */
.dark { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 24px; padding: 20px; background: #000; color: #fafafa; border-radius: var(--r20); transition: transform .3s var(--ease); }
.dark:active { transform: scale(.99); }
.pro .t { display: grid; gap: 2px; min-width: 0; }
.pro .nm { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.pro .sub { color: #9f9fa9; font-size: 12px; font-weight: 500; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pro .see { display: inline-flex; align-items: center; gap: 2px; flex: none; font-size: 14px; font-weight: 600; line-height: 1.4; }
.pro .see .i { width: 20px; height: 20px; transition: transform .3s var(--ease); }
@media (hover: hover) { .pro:hover .see .i { transform: translateX(3px); } }

/* 받은 초대 · 내 전시 관리 */
.rows { margin-top: 12px; }
.rows li + li { border-top: 1px solid var(--bg-teritary); }
.rows li:first-child { border-top: 1px solid var(--bg-teritary); }
.rows li:last-child { border-bottom: 1px solid var(--bg-teritary); }
.rw { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 16px 2px; text-align: left; transition: background .2s; border-radius: 0; }
@media (hover: hover) { .rw:hover .rt .i { transform: translateX(3px); } }
.rw .lead { width: 24px; height: 24px; flex: none; fill: none; stroke: var(--text-primary); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }   /* 11-10 B안: 앞 아이콘 24(Figma DS Icon/Outline, 선 2) */
.rw .tt { display: grid; gap: 2px; min-width: 0; flex: 1; }
.rw b { font-size: 16px; font-weight: 600; letter-spacing: -0.03em; }
.rw small { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.rw .rt { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.rw .rt strong { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }   /* 11-10 N2: 숫자는 받은 초대에만, Medium */
.rw .rt strong.red { color: var(--notice); }
.rw .rt .i { width: 24px; height: 24px; margin-right: -2px; color: var(--text-teritary); stroke-width: 2; transition: transform .3s var(--ease); }

/* 보관함 */
.vault { margin-top: 32px; }
@media (min-width: 900px) { .vault { margin-top: 0; } }
.vhead { display: flex; align-items: baseline; justify-content: space-between; }
.vhead h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.03em; } /* 11-07 Figma 대조 */
.vhead span { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.vhead .i { width: 18px; height: 18px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 14px; padding: 4px; border-radius: 9999px; background: var(--bg-secondary); }
.seg button { height: 40px; border-radius: 9999px; font-size: 14px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; transition: background .25s var(--ease), color .2s; }
.seg button[aria-selected="true"] { background: #000; color: #fff; font-weight: 600; }
.grid { margin-top: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 640px)  { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
@media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: block; background: #000; border-radius: var(--r12); overflow: hidden; color: #fff; animation: rise .55s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 35ms); transition: transform .3s var(--ease); }
.card:active { transform: scale(.98); }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.card .im { padding: 7px; }
.card .im div { position: relative; border-radius: var(--r12); overflow: hidden; background: #111; }
.card.ex .im div { aspect-ratio: 161 / 241; }
.card.wk .im div { aspect-ratio: 161 / 215; }
.card .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }
@media (hover: hover) { .card:hover .im img { transform: scale(1.03); } }
.badge { position: absolute; top: 8px; right: 8px; display: inline-flex; align-items: center; gap: 2px; padding: 3px 8px; border-radius: 9999px; background: rgba(255, 255, 255, .72); color: var(--text-primary); font-size: 12px; font-weight: 500; backdrop-filter: blur(10px); }
.badge .i { width: 13px; height: 13px; }
.tx { padding: 2px 12px 12px; display: grid; gap: 2px; }
.tx b { font-size: 14px; font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .l { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tx .m { display: flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 500; color: #a1a1aa; white-space: nowrap; overflow: hidden; }
.tx .m img { width: 14px; height: 14px; flex: none; }
.tx .m:first-of-type { margin-top: 6px; }
.artists { margin-top: 8px; }
/* 저장한 작가(11-06 확정, 후보 B): 글자 한 줄 "학교 · 분야" + 작품 사진 3점 미리보기 + 저장 아이콘. 분야 칩·아바타 없음. 작품이 1점이면 1점만, 없으면 이름만 */
.ar { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--bg-teritary); animation: rise .5s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 35ms); }
.ar-in { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 16px 0; border-radius: var(--r12); transition: transform .2s var(--ease); }
.ar-in:active { transform: scale(.985); }
.ar .nm { flex: 1; min-width: 0; }
.ar .nm b { display: block; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar .nm span { display: block; margin-top: 2px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ar .ths { flex: none; display: flex; gap: 4px; }
.ar .ths img { width: 40px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--bg-teritary); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
.ar .bm { position: relative; flex: none; width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; border-radius: 9999px; color: var(--text-primary); transition: transform .16s var(--ease); }
.ar .bm:active { transform: scale(.9); }
.ar .bm svg { grid-area: 1 / 1; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: opacity .25s cubic-bezier(.2, 0, 0, 1), transform .25s cubic-bezier(.2, 0, 0, 1), filter .25s cubic-bezier(.2, 0, 0, 1); }
.ar .bm .on { fill: currentColor; }
.ar .bm[aria-pressed="false"] .on, .ar .bm[aria-pressed="true"] .off { opacity: 0; transform: scale(.25); filter: blur(4px); }
/* 보관함 빈 상태(11-07 확정, 후보 B): 사과 대신 초대 — 아이콘 + 제목 + 설명 + 버튼, 아래에 인기 전시(작품) 줄 */
.empty { display: grid; justify-items: center; gap: 6px; padding: 40px 0 8px; text-align: center; }
.empty .eic { width: 56px; height: 56px; border-radius: 9999px; background: var(--bg-secondary); display: grid; place-items: center; margin-bottom: 4px; }
.empty .eic svg { width: 26px; height: 26px; fill: none; stroke: var(--text-primary); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.empty h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.empty p { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--text-secondary); text-wrap: balance; }
.empty .egb { margin-top: 14px; width: auto; height: 44px; display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 20px; border-radius: 9999px; background: var(--text-primary); color: #fff; font-size: 14px; font-weight: 600; transition: transform .2s var(--ease); }
.empty .egb:active { transform: scale(.97); }
.rec { margin-top: 32px; }
.rec h4 { margin: 0 0 12px; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.rail { display: flex; gap: 8px; margin-inline: calc(var(--pad) * -1); padding-inline: var(--pad); overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; scroll-padding-inline: var(--pad); padding-bottom: 28px; }
.rail::-webkit-scrollbar { display: none; }
.rc { position: relative; flex: none; width: 128px; scroll-snap-align: start; }
.rc a { display: block; transition: transform .2s var(--ease); }
.rc a:active { transform: scale(.97); }
.rc .im { position: relative; aspect-ratio: 3 / 4; border-radius: var(--r12); overflow: hidden; background: var(--bg-teritary); }
.rc .im img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rc .im::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); pointer-events: none; }
.rc b { display: block; margin-top: 8px; font-size: 14px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc small { display: block; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 시트(알림함·받은 초대·드로어)·모달 */
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(0, 0, 0, .42); animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: fixed; z-index: 71; background: #fff; display: flex; flex-direction: column; animation: slideUp .35s var(--ease); }
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } }
.sheet.full { inset: 0; }
.sheet.right { top: 0; right: 0; bottom: 0; width: min(322px, 82vw); border-radius: var(--r20) 0 0 var(--r20); animation-name: slideIn; }
@keyframes slideIn { from { transform: translateX(32px); opacity: 0; } }
@media (min-width: 768px) { .sheet.full { inset: 5vh auto 5vh 50%; width: 480px; margin-left: -240px; border-radius: var(--r20); } }
/* 전시 초대 수락(11-07, Figma 1694:11874 전시 작가명 시트 · 1759:13879 참여 완료): 아래 시트 → 완료 화면 */
.sheet.bot { left: 0; right: 0; bottom: 0; padding: 12px 20px max(16px, env(safe-area-inset-bottom)); border-radius: 20px 20px 0 0; max-height: 92dvh; overflow-y: auto; }
@media (min-width: 768px) { .sheet.bot { left: 50%; right: auto; width: 480px; margin-left: -240px; bottom: 6vh; border-radius: 20px; } }
.sheet.bot .gr { width: 40px; height: 4px; margin: 2px auto 14px; border-radius: 4px; background: #d4d4d8; }
.sheet.bot h2 { font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.03em; }
.sheet.bot .jl { margin-top: 16px; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.sheet.bot .jh { margin-top: 2px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); }
.sheet.bot label { display: block; margin-top: 24px; font-size: 14px; font-weight: 600; letter-spacing: -0.03em; }
.sheet.bot label .req { color: var(--notice); margin-left: 2px; }
.sheet.bot .jin { display: block; width: 100%; height: 48px; margin-top: 12px; padding: 0 16px; border: 1px solid var(--border-primary); border-radius: var(--r12); font: inherit; font-size: 16px; letter-spacing: -0.03em; color: var(--text-primary); background: #fff; transition: border-color .2s; }
.sheet.bot .jin:focus { outline: 0; border-color: var(--text-primary); }
.sheet.bot .jx { margin-top: 8px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); }
.sheet.bot .jbtn { display: grid; place-items: center; width: 100%; height: 48px; margin-top: 24px; border-radius: var(--r12); background: var(--text-primary); color: #fafafa; font-size: 14px; font-weight: 600; transition: background .2s, opacity .2s, transform .2s var(--ease); }
.sheet.bot .jbtn:active { transform: scale(.98); }
.sheet.bot .jbtn:disabled { background: var(--bg-teritary); color: var(--text-disable); cursor: default; transform: none; }
.jd { display: flex; flex-direction: column; height: 100%; padding: 0 20px max(12px, env(safe-area-inset-bottom)); }
.jd .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 0 40px; }
.jd .ring { position: relative; width: 64px; height: 64px; margin: 0 auto; display: grid; place-items: center; border-radius: 9999px; background: var(--text-primary); color: #fafafa; animation: dnRing .6s var(--ease) both; }
.jd .ring::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--text-primary); opacity: 0; animation: dnHalo .9s .18s var(--ease) both; z-index: -1; }
.jd .ring svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 28; animation: dnDraw .45s .3s var(--ease) backwards; }
.jd h2 { margin-top: 20px; text-align: center; font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.03em; animation: dnUp .5s .3s var(--ease) both; }
.jd .jsub { margin-top: 8px; text-align: center; font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--text-secondary); animation: dnUp .5s .36s var(--ease) both; }
.jd dl { margin: 32px 0 0; padding: 24px 20px; border-radius: var(--r12); background: var(--bg-secondary); display: grid; gap: 20px; animation: dnUp .55s .44s var(--ease) both; }
.jd dl div { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; animation: dnUp .45s var(--ease) both; }
.jd dl div:nth-child(1) { animation-delay: .5s; } .jd dl div:nth-child(2) { animation-delay: .55s; } .jd dl div:nth-child(3) { animation-delay: .6s; } .jd dl div:nth-child(4) { animation-delay: .65s; } .jd dl div:nth-child(5) { animation-delay: .7s; }
.jd dt { font-size: 14px; font-weight: 400; color: var(--text-secondary); }
.jd dd { margin: 0; font-size: 14px; font-weight: 600; text-align: right; }
.jd .cta2 { display: grid; gap: 8px; padding: 12px 0; animation: dnUp .5s .62s var(--ease) both; }
.jd .cta2 a { display: grid; place-items: center; height: 48px; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: background .2s, transform .2s var(--ease); }
.jd .cta2 a:active { transform: scale(.98); }
.jd .cta2 .p { background: var(--text-primary); color: #fafafa; } .jd .cta2 .s { background: var(--bg-secondary); }
@keyframes dnRing { from { transform: scale(.72); opacity: 0; } }
@keyframes dnUp { from { opacity: 0; transform: translateY(12px); } }
@keyframes dnDraw { from { stroke-dashoffset: 28; } }

let lastFocus = null, openSheet = null;
function closeSheet() { if (!openSheet) return; openSheet.sheet.remove(); openSheet.scrim.remove(); document.body.classList.remove('lock'); openSheet = null; if (lastFocus) lastFocus.focus(); }
function showSheet(cls, html, label) {
  closeSheet(); lastFocus = document.activeElement;
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.addEventListener('click', closeSheet);
  const sheet = document.createElement('div'); sheet.className = 'sheet ' + cls; sheet.setAttribute('role', 'dialog'); sheet.setAttribute('aria-modal', 'true'); sheet.setAttribute('aria-label', label); sheet.innerHTML = html;
  document.body.append(scrim, sheet); document.body.classList.add('lock'); openSheet = { sheet, scrim };
  sheet.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeSheet));
  (sheet.querySelector('[data-close]') || sheet).focus(); return sheet;
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.querySelector('dialog.modal[open]')) closeSheet(); });
function modal({ title, body, warn, acts }) {
  const d = document.createElement('dialog'); d.className = 'modal';
  d.innerHTML = `<h2>${title}</h2>${body ? `<p>${body}</p>` : ''}${warn ? `<div class="warn"><b>${warn[0]}</b><span>${warn[1]}</span></div>` : ''}<div class="acts">${acts.map((a, i) => `<button class="btn ${a.cls}" data-i="${i}">${a.label}</button>`).join('')}</div>`;
  document.body.append(d); d.showModal();
  d.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { const a = acts[+b.dataset.i]; d.close(); d.remove(); a.fn && a.fn(); } else if (e.target === d) { d.close(); d.remove(); } });
  d.addEventListener('close', () => d.remove());
}

    <a class="logo" href="home.html" aria-label="Display U. 홈"><img src="assets/img/logo.svg" alt="Display U." width="124" height="28"></a>
    <button class="prof" id="dr-prof"><span class="avatar"><svg aria-hidden="true"><use href="#i-avatar"/></svg></span><span><b>sangjun</b></span>${ic('i-chev')}</button>
    ${verified ? `<button class="cert" id="dr-cert"><span>작가 인증</span><small>인증 완료</small></button>` : `<button class="cert act" id="dr-cert"><span><b>작가 인증하기</b><small>전시를 등록하거나 초대를 수락할 때 필요해요</small></span>${ic('i-chev')}</button>`}
    <div class="grow"></div>
    <div class="bot"><button id="dr-out">로그아웃</button><button class="mute" id="dr-del">회원 탈퇴</button></div>
    <div class="foot"><nav><a href="#">이용약관</a><i></i><a href="#">개인정보처리방침</a></nav><small>© 2026 displayU. All rights reserved.</small></div></div>`, '설정');
  applyProfile(s.querySelector('#dr-prof'));
  s.querySelector('#dr-prof').addEventListener('click', () => { location.href = 'profile-edit.html?kind=basic'; });
  s.querySelector('#dr-cert').addEventListener('click', () => { if (!verified) location.href = 'verify.html'; });
  s.querySelector('#dr-out').addEventListener('click', () => modal({ title: '로그아웃할까요?', body: '로그아웃 후에도 저장한 전시와 기록은\n계정에 유지돼요', acts: [{ label: '취소', cls: 'btn-soft' }, { label: '로그아웃하기', cls: 'btn-dark', fn: () => { closeSheet(); if (window.Auth) Auth.logout(); location.href = 'home.html'; } }] }));
  s.querySelector('#dr-del').addEventListener('click', () => hasOwner
    ? modal({ title: '탈퇴할 수 없어요', body: '대표로 있는 전시를 위임하거나 삭제한 뒤\n탈퇴할 수 있어요', acts: [{ label: '닫기', cls: 'btn-soft' }, { label: '전시 관리로 이동', cls: 'btn-dark', fn: () => { location.href = 'manage.html'; } }] })
    : modal({ title: '탈퇴할까요?', body: '참여 중인 전시에서도 나가게 돼요', warn: ['삭제 안내', '작가 프로필과 작가로 연결된 작품은 복구할 수 없어요'], acts: [{ label: '취소', cls: 'btn-soft' }, { label: '탈퇴하기', cls: 'btn-red', fn: () => { closeSheet(); toast('탈퇴 처리 화면은 아직 준비 중이에요'); } }] }));
});
</script>
<script src="assets/auth.js"></script>
<script src="assets/tap.js"></script>
</body>
