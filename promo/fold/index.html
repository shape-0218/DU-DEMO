<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<!-- 브랜드 사이트 시안 8 · 병풍(11-15, 검토용 · 푸시 대상 아님)
     생각: 전시 포스터 11장이 한 틀의 병풍이다 → 처음엔 접혀 서 있다가 스크롤하면 펼쳐지며 옆으로 지나가고, 빨리 넘길수록 다시 접히고, 끝에서 다시 접힌다.
     참고: Codrops 튜토리얼 '구겨진 종이 효과'(종이가 접히는 3D) · 아카이브의 휘는 3D 판 사이트. 문구는 모두 ❓임시 -->
<base href="../../">
<title>Display U. — 펼쳐 보는 대학생 전시</title>
<meta name="description" content="대학생 전시와 작품을 발견하고, 감상하고, 기록하는 곳. Display U.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="promo/shared.css">
<style>
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) var(--m) 12px; }
.top .logo { display: inline-flex; align-items: center; min-height: 44px; }
.top .wm { width: 110px; }

/* 무대: 흰 벽 + 눈높이 아래 바닥. 병풍 폭마다 왼쪽 모서리를 축으로 번갈아 꺾여 서 있음 */
.view { position: sticky; top: 0; height: 100svh; min-height: 560px; overflow: hidden; background: var(--paper); --eye: 44%; }
.ground { position: absolute; left: 0; right: 0; top: var(--eye); bottom: 0; background: var(--bg2); }
.cam { position: absolute; inset: 0; perspective: var(--P, 1400px); perspective-origin: 50% var(--eye); }
.screen { position: absolute; left: 50%; top: var(--eye); width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
.pane { position: absolute; left: 0; top: var(--floor); width: var(--pw); display: grid; gap: 12px; padding-bottom: 18px; background: #fff; transform-origin: 0 50%; }
.pane img { width: 100%; aspect-ratio: 402 / 568; object-fit: cover; background: var(--bg2); }
.pane .sh { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }   /* 꺾인 면의 그늘 */
.pane.back img, .pane.back .cap { visibility: hidden; }
.cap { display: grid; gap: 2px; padding: 0 16px; font-size: 14px; color: var(--z6); min-width: 0; }
.cap > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cap strong { font-size: 20px; font-weight: 600; line-height: 1.25; color: var(--ink); }
.cap .dt { font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--z5); }
.pane:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }

.intro, .outro { position: absolute; z-index: 3; will-change: opacity, transform; }
.intro { left: var(--m); bottom: max(var(--m), env(safe-area-inset-bottom)); }
h1 { font-size: clamp(36px, 5.2vw, 80px); font-weight: 600; line-height: 1.08; }
.outro { left: 0; right: 0; bottom: max(var(--m), env(safe-area-inset-bottom)); display: grid; justify-items: center; gap: 8px; text-align: center; opacity: 0; visibility: hidden; }
.outro p { font-size: clamp(18px, 2vw, 24px); font-weight: 600; }
@media (max-width: 699px) { .cap strong { font-size: 16px; } .cap { font-size: 12px; padding: 0 12px; } .pane { gap: 10px; padding-bottom: 14px; } }

/* 움직임 줄이기: 접지 않고 평평한 목록 */
.flat .scene { height: auto !important; }
.flat .view { position: static; height: auto; min-height: 0; padding: 120px var(--m) 96px; }
.flat .ground, .flat .outro, .flat .sh { display: none; }
.flat .cam { position: static; perspective: none; }
.flat .screen { position: static; width: auto; height: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 32px 24px; transform: none !important; }
.flat .pane { position: static; width: auto; transform: none !important; }
.flat .intro { position: static; margin-bottom: 48px; opacity: 1 !important; transform: none !important; }

.end { background: var(--black); color: var(--fa); padding: clamp(96px, 12vw, 200px) var(--m) max(var(--m), env(safe-area-inset-bottom)); display: grid; gap: clamp(64px, 8vw, 120px); }
.end .big { display: inline-flex; align-items: center; gap: .25em; font-size: clamp(40px, 9vw, 136px); font-weight: 600; line-height: 1.05; }
.end .big svg { width: .8em; height: .8em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
@media (hover: hover) { .end .big:hover svg { transform: translateX(.12em); } }
.end .big:active { transform: scale(.98); }
.end .foot { display: flex; justify-content: space-between; align-items: end; gap: 24px; color: var(--z5); font-size: 14px; }
.end .foot .wm { width: 124px; color: var(--fa); }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="home.html" aria-label="Display U. 홈" id="logo"></a>
  <a class="go" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</header>
<main>
  <section class="scene" id="scene" aria-labelledby="h">
    <div class="view" id="view">
      <div class="ground" aria-hidden="true"></div>
      <div class="intro" id="intro"><h1 id="h">펼쳐 보는<br>대학생 전시</h1></div>
      <div class="cam"><div class="screen" id="screen"></div></div>
      <div class="outro" id="outro"><p>지금 디유에 걸린 전시 <span id="cnt"></span>개</p><a class="go" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    </div>
  </section>
</main>
<footer class="end">
  <a class="big" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <div class="foot"><span id="fwm"></span><span>대학생 전시 · 작품 아카이브</span></div>
</footer>

<script src="assets/demo-data.js"></script>
<script src="promo/shared.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id), { clamp, seg, rm } = BRAND;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pimg = (e) => BRAND.img('p' + String(e.i + 1).padStart(2, '0'));
  const ord = { '전시 중': 0, '전시 예정': 1, '종료': 2 }, list = [...DEMO.EXH].sort((a, b) => ord[a.st] - ord[b.st] || a.i - b.i), N = list.length;
  const view = $('view'), screen = $('screen'), scene = $('scene'), intro = $('intro'), outro = $('outro');
  $('logo').innerHTML = BRAND.wordmark(); $('fwm').innerHTML = BRAND.wordmark(); $('cnt').textContent = N;
  screen.innerHTML = list.map((e) => `<a class="pane" href="exhibition.html?e=${e.i}"><img src="${pimg(e)}" alt="" decoding="async"><span class="cap"><strong>${esc(e.t)}</strong><span>${esc(e.s)}</span><span class="dt">${esc(e.d)} · ${e.st}</span></span><i class="sh"></i></a>`).join('');
  const panes = [...screen.children].map((el) => ({ el, sh: el.querySelector('.sh') }));
  if (rm) { document.documentElement.classList.add('flat'); return; }

  /* 치수: w 한 폭 너비 · floor 눈높이에서 바닥까지 · P 원근 · open 펼쳤을 때 남는 꺾임 각도 · shut 접혔을 때 각도 */
  let G = {};
  function layout() {
    const small = innerWidth < 700;
    G = small ? { w: 210, floor: 236, P: 1000, open: 15, shut: 80 } : { w: Math.round(clamp(innerHeight * 0.4, 260, 340)), floor: 0, P: 1400, open: 16, shut: 80 };
    if (!small) G.floor = Math.round(G.w * 568 / 402 * 0.5 + 10);   /* 판 아래 끝이 아래 글자(제목·맺음 문장)와 겹치지 않는 높이 */
    view.style.setProperty('--pw', G.w + 'px'); view.style.setProperty('--P', G.P + 'px');
    panes.forEach((p) => { p.el.style.top = G.floor - p.el.offsetHeight + 'px'; });
    scene.style.height = innerHeight * (2.2 + N * 0.5) + 'px';
  }
  layout(); addEventListener('load', layout); let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
  const jp = parseFloat(new URLSearchParams(location.search).get('p')); if (jp >= 0) scrollTo(0, scene.offsetTop + jp * (scene.offsetHeight - innerHeight));   /* 검토용: ?p=0.5 */

  const sm = (x) => x * x * (3 - 2 * x), setO = (el, o, dy) => { el.style.opacity = o.toFixed(3); el.style.visibility = o < 0.01 ? 'hidden' : 'visible'; el.style.transform = `translate3d(0, ${((1 - o) * dy).toFixed(1)}px, 0)`; };
  let p = 0, sy = scrollY, sv = 0, extra = 0, mx = 0, ry = 0;
  addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') mx = e.clientX / innerWidth * 2 - 1; });
  screen.addEventListener('focusin', (e) => { const k = panes.findIndex((q) => q.el === e.target.closest('.pane')); if (k >= 0) scrollTo({ top: scene.offsetTop + (0.2 + 0.6 * k / (N - 1)) * (scene.offsetHeight - innerHeight) }); });
  BRAND.loop((dt) => {
    const r = scene.getBoundingClientRect(), tp = clamp(-r.top / Math.max(1, r.height - innerHeight));
    p += (tp - p) * (1 - Math.exp(-dt * 8));
    const y = scrollY; sv += ((y - sy) / Math.max(dt, 0.001) - sv) * Math.min(1, dt * 6); sy = y;
    /* 0~.2 펼쳐짐 · .2~.8 한 폭씩 옆으로 · .82~1 다시 접힘. 빨리 넘기면 그만큼 더 접힘(최대 +38°) */
    const closed = Math.max(1 - sm(seg(p, 0, 0.2)), sm(seg(p, 0.82, 1)));
    extra += (clamp(Math.abs(sv) * 0.022, 0, 38) * (1 - closed) - extra) * Math.min(1, dt * 7);
    const th = (G.open + (G.shut - G.open) * closed + extra) * Math.PI / 180, c = G.w * Math.cos(th), d = G.w * Math.sin(th), deg = th * 180 / Math.PI;
    const f = (N - 1) * seg(p, 0.2, 0.8), off = -(f + 0.5) * c * (1 - closed) - (N * c / 2) * closed;
    ry += (mx * -7 - ry) * Math.min(1, dt * 5);
    screen.style.transform = `rotateY(${ry.toFixed(3)}deg) translate3d(0, 0, -1px)`;   /* -1px: 아이폰 Safari는 이 칸의 변형이 '아무것도 안 함'이면 안쪽 3D를 납작하게 그림 → 항상 3D 변형이 있게 */
    const s = Math.sin(th);
    panes.forEach((q, k) => {
      const even = k % 2 === 0;
      q.el.style.transform = `translate3d(${(k * c + off).toFixed(2)}px, 0, ${even ? 0 : (-d).toFixed(2)}px) rotateY(${(even ? deg : -deg).toFixed(3)}deg)`;
      q.sh.style.opacity = (s * (even ? 0.46 : 0.1)).toFixed(3);
      const back = (even ? -1 : 1) * s * (k * c + off + c / 2) + Math.cos(th) * (G.P + d / 2) < 0;   /* 눈에서 볼 때 뒷면이면 포스터 대신 빈 흰 판(병풍 뒷면) */
      if (back !== q.back) { q.back = back; q.el.classList.toggle('back', back); }
    });
    setO(intro, 1 - seg(p, 0.02, 0.12), -24); setO(outro, seg(p, 0.93, 1), 16);
  });
})();
</script>
</body>
</html>
