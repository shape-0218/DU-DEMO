<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<!-- 브랜드 사이트 시안 4 · 전시장(11-15, 검토용 · 푸시 대상 아님)
     생각: 스크롤이 걸음이 된다 → 흰 전시장 안으로 걸어 들어가면 전시 포스터가 세워진 판에 걸려 양옆으로 지나가고, 끝 벽에 로고가 있다. 문구는 모두 ❓임시 -->
<base href="../../">
<title>Display U. — 걸어 들어가는 대학생 전시</title>
<meta name="description" content="대학생 전시와 작품을 발견하고, 감상하고, 기록하는 곳. Display U.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="promo/shared.css">
<style>
.top { position: fixed; left: 0; right: 0; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) var(--m) 12px; }
.top .logo { display: inline-flex; align-items: center; min-height: 44px; }
.top .wm { width: 110px; }

/* 전시장: 흰 벽 + 눈높이(44%) 아래는 바닥. 판은 3D 공간에 서 있고 카메라(스크롤)가 앞으로 걸어감 */
.view { position: sticky; top: 0; height: 100svh; min-height: 560px; overflow: hidden; background: var(--paper); --eye: 44%; }
.ground { position: absolute; left: 0; right: 0; top: var(--eye); bottom: 0; background: var(--bg2); }
.cam { position: absolute; inset: 0; perspective: var(--P, 1000px); perspective-origin: 50% var(--eye); }
.world { position: absolute; left: 50%; top: var(--eye); width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
.board { position: absolute; left: calc(var(--bw) / -2); top: var(--floor); width: var(--bw); display: grid; gap: 14px; padding: 18px 18px 22px; background: #fff; transform: translate3d(var(--x), -100%, var(--z)) rotateY(var(--r)); will-change: opacity; }
.board img { width: 100%; aspect-ratio: 402 / 568; object-fit: cover; background: var(--bg2); }
.cap { display: grid; gap: 2px; font-size: 14px; color: var(--z6); }
.cap strong { font-size: 22px; font-weight: 600; line-height: 1.25; color: var(--ink); }
.cap .dt { font-variant-numeric: tabular-nums; letter-spacing: 0; color: var(--z5); }
.cap .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--z5); }
.cap .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--z3); }
.cap .st[data-st="전시 중"] { color: var(--ink); } .cap .st[data-st="전시 중"] i { background: var(--ink); }
.cap .st[data-st="전시 예정"] i { background: none; box-shadow: inset 0 0 0 2px var(--z5); }
.board:focus-visible { outline: 3px solid var(--ink); outline-offset: 6px; }
.endwall { position: absolute; left: calc(var(--ew) / -2); top: calc(var(--ew) / -8.8 - 48px); width: var(--ew); transform: translate3d(0, 0, var(--z)); }

/* 겹쳐 놓는 글: 들어가기 전 제목(왼쪽 아래), 끝에서 한 줄 + 링크 */
.intro, .outro { position: absolute; z-index: 3; will-change: opacity, transform; }
.intro { left: var(--m); bottom: max(var(--m), env(safe-area-inset-bottom)); }
h1 { font-size: clamp(36px, 6.2vw, 96px); font-weight: 600; line-height: 1.08; }
.outro { left: 0; right: 0; top: 66%; display: grid; justify-items: center; gap: 8px; text-align: center; opacity: 0; visibility: hidden; }
.outro p { font-size: clamp(18px, 2vw, 24px); font-weight: 600; }
@media (max-width: 699px) { .cap strong { font-size: 18px; } .cap { font-size: 12px; } .board { padding: 14px 14px 18px; gap: 10px; } }

/* 움직임 줄이기: 3D 없이 포스터 판을 평평한 목록으로 */
.flat .scene { height: auto !important; }
.flat .view { position: static; height: auto; min-height: 0; padding: 120px var(--m) 96px; }
.flat .ground, .flat .endwall, .flat .outro { display: none; }
.flat .cam { position: static; perspective: none; }
.flat .world { position: static; width: auto; height: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 32px 24px; transform: none !important; }
.flat .board { position: static; width: auto; padding: 0; transform: none; opacity: 1 !important; }
.flat .intro { position: static; margin-bottom: 48px; opacity: 1 !important; transform: none !important; }

.end { background: var(--black); color: var(--fa); padding: clamp(96px, 12vw, 200px) var(--m) max(var(--m), env(safe-area-inset-bottom)); display: grid; gap: clamp(64px, 8vw, 120px); }
.end .big { display: inline-flex; align-items: center; gap: .25em; font-size: clamp(40px, 9vw, 136px); font-weight: 600; line-height: 1.05; }
.end .big svg { width: .8em; height: .8em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
@media (hover: hover) { .end .big:hover svg { transform: translateX(.12em); } }
.end .big:active { transform: scale(.98); }
.end .foot { display: flex; justify-content: space-between; align-items: end; gap: 24px; color: var(--z5); font-size: 14px; }
.end .foot .wm { width: 124px; color: var(--fa); }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="home.html" aria-label="Display U. 홈" id="logo"></a>
  <a class="go" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</header>
<main>
  <section class="scene" id="scene" aria-labelledby="h">
    <div class="view" id="view">
      <div class="ground" aria-hidden="true"></div>
      <div class="intro" id="intro"><h1 id="h">걸어 들어가는<br>대학생 전시</h1></div>
      <div class="cam"><div class="world" id="world"></div></div>
      <div class="outro" id="outro"><p>지금 디유에 걸린 전시 <span id="cnt"></span>개</p><a class="go" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></div>
    </div>
  </section>
</main>
<footer class="end">
  <a class="big" href="home.html">전시 둘러보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <div class="foot"><span id="fwm"></span><span>대학생 전시 · 작품 아카이브</span></div>
</footer>

<script src="assets/demo-data.js"></script>
<script src="promo/shared.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id), { clamp, seg, rm } = BRAND;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pimg = (e) => BRAND.img('p' + String(e.i + 1).padStart(2, '0'));
  const ord = { '전시 중': 0, '전시 예정': 1, '종료': 2 }, list = [...DEMO.EXH].sort((a, b) => ord[a.st] - ord[b.st] || a.i - b.i);
  const view = $('view'), world = $('world'), scene = $('scene'), intro = $('intro'), outro = $('outro');
  $('logo').innerHTML = BRAND.wordmark(); $('fwm').innerHTML = BRAND.wordmark(); $('cnt').textContent = list.length;
  world.innerHTML = list.map((e) => `<a class="board" href="exhibition.html?e=${e.i}"><img src="${pimg(e)}" alt="" decoding="async"><span class="cap"><span class="st" data-st="${e.st}"><i></i>${e.st}</span><strong>${esc(e.t)}</strong><span>${esc(e.s)}</span><span class="dt">${esc(e.d)}</span></span></a>`).join('') + `<div class="endwall" role="img" aria-label="Display U.">${BRAND.wordmark()}</div>`;
  const boards = [...world.querySelectorAll('.board')], endwall = world.querySelector('.endwall');
  if (rm) { document.documentElement.classList.add('flat'); return; }

  /* 공간 치수(px): P 원근 · X 판이 가운데에서 떨어진 거리 · th 판이 안쪽으로 튼 각도 · D 판 사이 깊이 · floor 눈높이에서 바닥까지 */
  let G = {};
  function layout() {
    const vw = innerWidth, small = vw < 700;
    G = small ? { P: 820, X: clamp(vw * 0.31, 112, 150), th: 30, bw: 280, D: 560, Z0: 520, floor: 300, ew: 560, stop: 560 }
              : { P: 1000, X: clamp(vw * 0.27, 310, 460), th: 22, bw: 420, D: 620, Z0: 460, floor: 390, ew: 1700, stop: 700 };
    G.endZ = G.Z0 + boards.length * G.D + 900; G.max = G.endZ - G.stop;   /* 마지막 판을 완전히 지나친 뒤에 끝 벽 앞에서 멈춤 */
    view.style.setProperty('--P', G.P + 'px'); view.style.setProperty('--bw', G.bw + 'px'); view.style.setProperty('--floor', G.floor + 'px'); view.style.setProperty('--ew', G.ew + 'px');
    boards.forEach((b, k) => { const side = k % 2 ? 1 : -1; b._z = -(G.Z0 + k * G.D); b._o = -1; b.style.setProperty('--x', side * G.X + 'px'); b.style.setProperty('--z', b._z + 'px'); b.style.setProperty('--r', -side * G.th + 'deg'); });
    endwall.style.setProperty('--z', -G.endZ + 'px');
    scene.style.height = innerHeight + G.max / 1.2 + 'px';
  }
  layout(); let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
  /* 검토용: 주소 끝에 ?p=0.5 처럼 붙이면 그 지점에서 시작 */
  const jp = parseFloat(new URLSearchParams(location.search).get('p')); if (jp >= 0) scrollTo(0, scene.offsetTop + jp * (scene.offsetHeight - innerHeight));

  /* 걷기: 스크롤 위치 → 카메라 깊이(부드럽게 따라감). 마우스는 고개를 살짝 돌림. 먼 판은 흰 벽에 묻혀 있다가 다가오며 또렷해지고, 지나치면 사라짐 */
  let cam = -520, mx = 0, my = 0, rx = 0, ry = 0;
  addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse') return; mx = e.clientX / innerWidth * 2 - 1; my = e.clientY / innerHeight * 2 - 1; });
  world.addEventListener('focusin', (e) => { const b = e.target.closest('.board'); if (b) scrollTo({ top: scene.offsetTop + clamp((-b._z - 520) / G.max) * (scene.offsetHeight - innerHeight) }); });
  const setO = (el, o) => { el.style.opacity = o.toFixed(3); el.style.visibility = o < 0.01 ? 'hidden' : 'visible'; };
  BRAND.loop((dt) => {
    const r = scene.getBoundingClientRect(), p = clamp(-r.top / Math.max(1, r.height - innerHeight));
    cam += (p * G.max - cam) * (1 - Math.exp(-dt * 8));
    ry += (mx * 3.2 - ry) * Math.min(1, dt * 5); rx += (-my * 1.8 - rx) * Math.min(1, dt * 5);
    world.style.transform = `rotateX(${rx.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg) translate3d(0, 0, ${cam.toFixed(1)}px)`;
    for (const b of boards) {
      const zr = b._z + cam, o = clamp((3000 + zr) / 900) * (1 - clamp((zr - 160) / 240));
      if (Math.abs(o - b._o) > 0.004) { b._o = o; b.style.opacity = o.toFixed(3); b.style.pointerEvents = o < 0.4 ? 'none' : 'auto'; }
    }
    const io = 1 - clamp(cam / 280); intro.style.opacity = io.toFixed(3); intro.style.transform = `translate3d(0, ${((1 - io) * -24).toFixed(1)}px, 0)`; intro.style.visibility = io < 0.01 ? 'hidden' : 'visible';
    setO(outro, seg(cam / G.max, 0.955, 1));
    setO(endwall, clamp((3600 - G.endZ + cam) / 1200));   /* 끝 벽 로고도 멀 때는 흰 벽에 묻혀 있음 */
  });
})();
</script>
</body>
</html>
