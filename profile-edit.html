<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>프로필 수정 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 작가 인증(verify.html)·전시 등록(exhibition-new.html)의 입력 부품과 같은 값. 11-07 프로필 수정 */
:root {
  --text-primary: #18181b;
  --text-secondary: #3f3f47;
  --text-teritary: #71717b;
  --text-disable: #d4d4d8;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --bg-teritary: #f0f0f3;
  --notice: #fb2c36;
  --r12: 12px; --r20: 20px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --gx: 20px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; letter-spacing: -0.03em; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; color: var(--text-primary); font: 500 14px/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
::selection { background: var(--text-primary); color: #fff; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; letter-spacing: -0.03em; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; z-index: 90; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; background: var(--text-primary); color: #fff; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: top .2s var(--ease); }
.skip:focus-visible { top: 8px; }
.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* 한 칸짜리 세로 화면: 폰은 전체 폭, 태블릿·노트북은 가운데 672(전시 등록 등 다른 입력 화면과 같은 규칙) */
.page { width: 100%; max-width: 480px; min-height: 100dvh; margin-inline: auto; padding: max(8px, env(safe-area-inset-top)) var(--gx) 0; display: flex; flex-direction: column; }
@media (min-width: 768px) { :root { --gx: 32px; } .page { max-width: 672px; padding-top: 40px; } }
@media (min-width: 900px) { :root { --gx: 40px; } }

.bar { display: flex; align-items: center; gap: 2px; height: 56px; margin-left: -10px; }
.bar button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9999px; transition: background .2s; }
@media (hover: hover) { .bar button:hover { background: var(--bg-secondary); } }
.bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; } /* 11-07 Figma 대조(확인 후 적용): 18→20, Q1 700 */
.lead { margin-top: 8px; font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.03em; }

form { flex: 1; display: flex; flex-direction: column; }
.fields { flex: 1; }
.field { margin-top: 28px; animation: rise .45s var(--ease) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.field > label, .field .lb { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
.field > label b, .field .lb b { font-weight: 600; }
.req { color: var(--notice); margin-left: 3px; }
.cnt { font-size: 12px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.line { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.ul { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 48px; border-bottom: 1px solid var(--border-primary); transition: border-color .2s; }
.ul:focus-within { border-bottom-color: var(--text-primary); }
.field.err .ul { border-bottom-color: var(--notice); }
.ul input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 500; }
.ul input::placeholder { color: var(--text-teritary); }   /* 11-08: Figma Field과 같은 text/teritary */
.ul input[readonly] { color: var(--text-primary); }
.ul .i { width: 22px; height: 22px; color: var(--text-primary); }
.ul .tm { margin-left: 8px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.field.err .tm { color: var(--notice); }
.act { flex: none; min-width: 88px; height: 44px; padding: 0 16px; border-radius: var(--r12); background: var(--text-primary); color: #fff; font-size: 14px; font-weight: 600; transition: background .2s, color .2s, transform .2s var(--ease); }
@media (hover: hover) { .act:hover:not(:disabled) { background: #2f2f35; } }
.act:active:not(:disabled) { transform: scale(.97); }
.act:disabled { background: var(--bg-secondary); color: var(--text-disable); cursor: default; }
.help { margin-top: 6px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-secondary); }
.help.e { color: var(--notice); }

/* 분야 칩 */
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
@media (min-width: 768px) { .chips { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.chip { height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border-primary); border-radius: 8px; font-size: 14px; font-weight: 500; transition: background .2s, color .2s, border-color .2s, transform .2s var(--ease); }
@media (hover: hover) { .chip:hover { background: var(--bg-secondary); } }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--text-primary); border-color: var(--text-primary); color: #fff; }
.chip .i { width: 16px; height: 16px; stroke-width: 2.2; }
.chip.nudge { animation: nudge .3s var(--ease); }
@keyframes nudge { 30% { transform: translateX(-3px); } 65% { transform: translateX(3px); } }

/* 하단 버튼 */
.cta { position: sticky; bottom: 0; padding: 20px 0 max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 28%); }
.big { width: 100%; height: 48px; border-radius: var(--r12); background: var(--text-primary); color: #fff; font-size: 16px; font-weight: 600; transition: background .2s, color .2s, transform .2s var(--ease); }
@media (hover: hover) { .big:hover:not(:disabled) { background: #2f2f35; } }
.big:active:not(:disabled) { transform: scale(.99); }
.big:disabled { background: var(--bg-secondary); color: var(--text-disable); cursor: default; }
.demo { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg-secondary); font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); }
.demo b { color: var(--text-secondary); font-weight: 600; }

/* 스낵바 · 모달 */
.snack { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); width: min(440px, calc(100vw - 40px)); padding: 14px 18px; border-radius: 8px; background: #000; color: #fff; font-size: 14px; font-weight: 500; line-height: 1.4; opacity: 0; pointer-events: none; z-index: 95; transition: opacity .25s, transform .35s var(--ease); }   /* 11-07 Figma 대조: 스낵바도 토스트와 같은 14/18 */
.snack.on { opacity: 1; transform: translate(-50%, 0); }
dialog.modal { width: min(322px, calc(100vw - 80px)); padding: 24px 20px 20px; border: 0; border-radius: var(--r20); background: #fff; color: var(--text-primary); animation: popm .25s var(--ease); }
dialog.modal::backdrop { background: rgba(0, 0, 0, .42); }
@keyframes popm { from { opacity: 0; transform: scale(.96); } }
.modal h2 { font-size: 20px; font-weight: 700; line-height: 1.4; } /* 11-07 Figma 대조(확인 후 적용) */
.modal p { margin-top: 8px; font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--text-teritary); }
.modal .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn { height: 44px; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: background .2s, transform .2s var(--ease); }
.btn:active { transform: scale(.98); }
.btn-soft { background: var(--bg-teritary); } .btn-soft:hover { background: #e4e4e7; }
.btn-dark { background: var(--text-primary); color: #fff; } .btn-dark:hover { background: #2f2f35; }


/* 프로필 수정 전용 */
.pphoto { margin-top: 16px; }
.pphoto + .field { margin-top: 20px; }   /* 11-08 Figma: 사진 아래 안내 글이 없어서 사진 → 첫 입력 20 */
.chip .ck { display: none; }
.chip[aria-pressed="true"] .ck { display: block; }
.ta { display: block; width: 100%; height: 132px; margin-top: 8px; padding: 14px 16px; border: 1px solid var(--border-primary); border-radius: var(--r12); font: inherit; font-size: 16px; font-weight: 500; line-height: 1.4; resize: none; outline: 0; color: inherit; transition: border-color .2s; }
.ta:focus { border-color: var(--text-primary); }
.ta::placeholder { color: var(--text-teritary); }
.cnt-r { margin-top: 6px; text-align: right; font-size: 12px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.field > label .opt { margin-left: 6px; font-size: 12px; font-weight: 500; color: var(--text-teritary); }
.ul.bad, .ul.bad:focus-within { border-bottom-color: var(--notice); }
.help.ok { color: #00c758; }   /* 11-08 Figma: 사용 가능 = 초록 글자만(아이콘 없음) */
.field.first { animation: none; }
/* 움직임 줄이기(11-08, 모든 화면 공통): 움직임·전환을 거의 없애되 상태 변화(색·불투명도)는 즉시 반영 */
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
</defs></svg>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<div class="page" id="page">
  <main id="main" style="flex:1;display:flex;flex-direction:column">
    <div class="bar">
      <button type="button" id="back" aria-label="뒤로"><svg class="i"><use href="#i-back"/></svg></button>
      <h1 id="ttl">프로필 수정</h1>
    </div>
    <form id="form" novalidate autocomplete="off">
      <div class="fields" id="fields"></div>
      <div class="cta">
        <p class="demo" id="demo" hidden><b>데모용</b> 닉네임 <b>admin · 디유 · 민재 · 서하</b>는 “이미 사용 중”으로 보여줘요</p>
        <button type="submit" class="big" id="save" disabled>저장</button>
      </div>
    </form>
  </main>
</div>
<div class="snack" id="snack" role="status" aria-live="polite"></div>
<dialog class="modal" id="leave" aria-labelledby="leave-t">
  <h2 id="leave-t">수정을 그만할까요?</h2>
  <p>바꾼 내용은 저장되지 않아요.</p>
  <div class="acts"><button type="button" class="btn btn-soft" id="stay">계속 수정</button><button type="button" class="btn btn-dark" id="exit">나가기</button></div>
</dialog>
<script src="assets/photo.js"></script>
<script>
/* 프로필 수정 (11-07 확정 정책)
   기본 프로필: 사진(원) + 닉네임 — 한글·영문·숫자만, 공백·특수문자 불가, 2~15자, 중복 확인 필수(닉네임이 곧 @아이디)
   작가 프로필: 사진(둥근 사각) + 작가 프로필명(20자) + 작가 분야(최대 2) + 소개(100자) + Instagram · Portfolio(2개)
   진입: 마이 설정 드로어의 프로필 요약 → ?kind=basic / 작가 프로필 본인 보기의 연필·사진 → ?kind=artist
   저장: localStorage du.profile(기본), du.cert(작가, 작가 인증과 같은 키) — 서버가 없어서 데모용 */
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const KIND = q.get('kind') === 'artist' ? 'artist' : 'basic';
const BACK = KIND === 'artist' ? 'artist.html?me=1' : 'my.html?state=after';
/* 이동 기록(11-08): 수정·인증 화면은 '거쳐 가는 화면'이라 기록에 남기지 않음 — 저장·나가기는 교체(replace), 온 곳이 돌아갈 곳이면 history.back()
   (이렇게 하지 않으면 작가 프로필에서 뒤로 가기를 눌렀을 때 방금 나온 수정 화면으로 되돌아감) */
const leaveTo = (dest) => { let ref = ''; try { const u = new URL(document.referrer); if (u.origin === location.origin) ref = u.pathname.split('/').pop(); } catch (e) {} if (ref && ref === dest.split('?')[0] && history.length > 1) history.back(); else location.replace(dest); };
const FIELDS = ['회화', '조소', '사진', '그래픽', '브랜딩', '제품', '가구', '공간', '건축', 'UXUI', '공예', '기타'];
const MAX = 2, TAKEN = ['admin', '디유', 'displayu', '민재', '서하'];
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const load = (k) => { try { return JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { return {}; } };
const store = (k, o) => { try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {} };
let st1; function snack(m) { const s = $('snack'); s.textContent = m; s.classList.add('on'); clearTimeout(st1); st1 = setTimeout(() => s.classList.remove('on'), 2600); }

const P = load('du.profile'), C = load('du.cert');
const S = KIND === 'basic'
  ? { img: P.img || '', nick: P.nick || 'sangjun' }
  : { img: C.img != null ? C.img : 'assets/img/artist-sample.jpg', name: C.name || '고상준', fields: new Set(C.fields && C.fields.length ? C.fields : ['그래픽', '브랜딩']), bio: C.bio != null ? C.bio : '빛과 색의 경계를 탐구하며, 일상에서 발견한 순간들을 작품으로 표현합니다.', ig: C.ig != null ? C.ig : 'sangjun.works', web: C.web != null ? C.web : 'sangjun-works.com' };
const snap = () => JSON.stringify(KIND === 'basic' ? { i: S.img, n: S.nick } : { i: S.img, n: S.name, f: [...S.fields].sort(), b: S.bio, g: S.ig, w: S.web });
let saved = snap(), checked = false, takenMsg = false, ORIG = S.nick;

/* ---------- 화면 ---------- */
document.title = (KIND === 'basic' ? '기본 정보 수정' : '작가 프로필 수정') + ' · Display U.'; $('ttl').textContent = KIND === 'basic' ? '기본 정보 수정' : '작가 프로필 수정';
const photo = `<div class="pphoto" id="photo"></div>`;
$('fields').innerHTML = KIND === 'basic' ? `${photo}
  <div class="field"><label for="nick"><span>닉네임<span class="req" aria-hidden="true">*</span></span></label>
    <div class="line"><div class="ul" id="nul"><input id="nick" type="text" maxlength="15" placeholder="닉네임" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(S.nick)}" aria-describedby="nhelp"></div><button type="button" class="act" id="ck" disabled>중복 확인</button></div>
    <p class="help" id="nhelp"></p></div>`
: `${photo}
  <div class="field"><label for="pname"><span>작가 프로필명<span class="req" aria-hidden="true">*</span></span></label>
    <div class="ul" style="margin-top:8px"><input id="pname" type="text" maxlength="20" placeholder="작가 프로필명" autocomplete="off" value="${esc(S.name)}"></div></div>
  <div class="field"><div class="lb"><span id="fl">작가 분야<span class="req" aria-hidden="true">*</span></span><span class="cnt" id="fcnt" aria-live="polite"></span></div>
    <div class="chips" id="chips" role="group" aria-labelledby="fl">${FIELDS.map((f) => `<button type="button" class="chip" aria-pressed="${S.fields.has(f)}" data-f="${f}"><svg class="i ck" aria-hidden="true"><use href="#i-check"/></svg>${f}</button>`).join('')}</div></div>
  <div class="field"><label for="bio"><span>소개<span class="opt">· 선택</span></span></label>
    <textarea class="ta" id="bio" maxlength="100" placeholder="나를 소개해 주세요">${esc(S.bio)}</textarea><p class="cnt-r" id="bcnt"></p></div>
  <div class="field"><label for="ig"><span>Instagram<span class="opt">· 선택</span></span></label>
    <div class="ul" id="igul" style="margin-top:8px"><input id="ig" type="text" maxlength="60" placeholder="아이디 (예: sangjun.works)" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(S.ig)}" aria-describedby="ighelp"></div><p class="help" id="ighelp"></p></div>
  <div class="field"><label for="web"><span>Portfolio<span class="opt">· 선택</span></span></label>
    <div class="ul" id="webul" style="margin-top:8px"><input id="web" type="text" inputmode="url" maxlength="120" placeholder="ex) sangjun-works.com" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(S.web)}" aria-describedby="webhelp"></div><p class="help" id="webhelp"></p></div>`;
if (KIND === 'basic') $('demo').hidden = false;
$('photo').innerHTML = PhotoPick.html(KIND === 'basic' ? 'circle' : 'rect', S.img);
PhotoPick.bind($('photo'), { kind: KIND === 'basic' ? 'circle' : 'rect', onDone: (d) => { S.img = d; update(); } });

/* ---------- 검증 (전시 등록의 링크 입력과 같은 규칙·문구) ---------- */
const parseIg = (v) => { const s = v.trim().replace(/^https?:\/\/(www\.)?instagram\.com\//i, '').replace(/^@/, '').replace(/[/?].*$/, ''); return { id: s, ok: s === '' ? null : /^[A-Za-z0-9._]{1,30}$/.test(s) }; };
const parseWeb = (v) => { const s = v.trim(); return { ok: s === '' ? null : /^(https?:\/\/)?([a-z0-9-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(s), href: /^https?:/i.test(s) ? s : 'https://' + s }; };
function linkHelp(key, r, okMsg, errMsg, def) { const ul = $(key + 'ul'), h = $(key + 'help'); ul.classList.toggle('bad', r.ok === false); h.classList.toggle('e', r.ok === false); h.textContent = r.ok === false ? errMsg : r.ok ? okMsg : def; }

function update() {
  let valid;
  if (KIND === 'basic') {
    const v = S.nick, ul = $('nul'), help = $('nhelp'), ck = $('ck'); let err = '';
    if (/\s/.test(v)) err = '공백은 쓸 수 없어요'; else if (/[^0-9A-Za-z가-힣]/.test(v)) err = '한글, 영문, 숫자만 쓸 수 있어요'; else if (v.length && v.length < 2) err = '2자 이상 입력해주세요';
    const changed = v !== ORIG;
    ul.classList.toggle('bad', !!err || takenMsg);
    ck.disabled = !(changed && !err && v.length >= 2 && !checked); ck.textContent = checked ? '확인 완료' : '중복 확인';
    help.className = 'help';
    if (err) { help.classList.add('e'); help.textContent = err; }
    else if (takenMsg) { help.classList.add('e'); help.textContent = '이미 사용 중인 닉네임이에요'; }
    else if (checked) { help.classList.add('ok'); help.textContent = '사용할 수 있는 닉네임이에요'; }
    else if (changed && v.length >= 2) help.textContent = '중복 확인을 해주세요';
    else help.textContent = '한글, 영문, 숫자로 2~15자';
    valid = !err && v.length >= 2 && (v === ORIG || checked);
  } else {
    $('fcnt').textContent = `${S.fields.size} / ${MAX}`; $('bcnt').textContent = `${S.bio.length} / 100`;
    const g = parseIg(S.ig), w = parseWeb(S.web);
    linkHelp('ig', g, `instagram.com/${g.id} 로 연결돼요`, '아이디 형식을 확인해 주세요 (영문·숫자·밑줄·마침표)', '@ 없이 아이디만 적어주세요');
    linkHelp('web', w, `${w.href} 로 연결돼요`, '주소 형식을 확인해 주세요 (예: sangjun-works.com)', '작업 사이트나 포트폴리오 주소를 적어주세요');
    valid = S.name.trim() && S.fields.size >= 1 && g.ok !== false && w.ok !== false;
  }
  $('save').disabled = !(snap() !== saved && valid);
}

$('form').addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'nick') { S.nick = t.value; checked = false; takenMsg = false; }
  else if (t.id === 'pname') S.name = t.value;
  else if (t.id === 'bio') S.bio = t.value;
  else if (t.id === 'ig') S.ig = t.value;
  else if (t.id === 'web') S.web = t.value;
  else return;
  update();
});
$('form').addEventListener('focusout', (e) => { if (e.target.id === 'ig') { const g = parseIg(S.ig); if (g.ok) { e.target.value = S.ig = g.id; update(); } } });   // @나 주소를 붙여 넣어도 아이디만 남김
if (KIND === 'basic') $('ck').addEventListener('click', () => { if (TAKEN.includes(S.nick.toLowerCase())) { checked = false; takenMsg = true; } else { checked = true; takenMsg = false; } update(); });
else $('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return; const f = b.dataset.f;
  if (S.fields.has(f)) S.fields.delete(f);
  else if (S.fields.size >= MAX) { snack(`분야는 최대 ${MAX}개까지 선택할 수 있어요`); b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); return; }
  else S.fields.add(f);
  b.setAttribute('aria-pressed', S.fields.has(f)); update();
});

/* ---------- 저장 · 이탈 ---------- */
$('form').addEventListener('submit', (e) => {
  e.preventDefault(); if ($('save').disabled) return;
  if (KIND === 'basic') store('du.profile', { ...load('du.profile'), nick: S.nick, img: S.img });
  else store('du.cert', { ...load('du.cert'), name: S.name.trim(), fields: [...S.fields], bio: S.bio.trim(), ig: parseIg(S.ig).id, web: S.web.trim(), img: S.img });
  saved = snap(); ORIG = S.nick; checked = false; update(); snack('프로필을 저장했어요');
  setTimeout(() => { location.replace(BACK); }, 900);   // 저장 뒤엔 수정 화면을 기록에서 빼고 돌아감
});
const leave = $('leave');
$('back').addEventListener('click', () => { if (snap() !== saved) leave.showModal(); else leaveTo(BACK); });
$('stay').addEventListener('click', () => leave.close());
$('exit').addEventListener('click', () => leaveTo(BACK));
leave.addEventListener('click', (e) => { if (e.target === leave) leave.close(); });
update();
</script>
<script src="assets/auth.js"></script>
<script src="assets/tap.js"></script>
</body>
