<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>작가 인증 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 값은 Figma 변수와 작가 인증 · 개선안(2686:31954) 17장에서 가져옴 */
:root {
  --text-primary: #18181b;
  --text-secondary: #3f3f47;
  --text-teritary: #71717b;
  --text-disable: #d4d4d8;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --bg-teritary: #f0f0f3;
  --notice: #fb2c36;
  --r12: 12px; --r20: 20px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --gx: 20px;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; letter-spacing: -0.03em; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #fff; color: var(--text-primary); font: 500 14px/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; }
body.lock { overflow: hidden; }
::selection { background: var(--text-primary); color: #fff; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; letter-spacing: -0.03em; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; z-index: 90; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; background: var(--text-primary); color: #fff; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: top .2s var(--ease); }
.skip:focus-visible { top: 8px; }
.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }

/* 한 칸짜리 세로 화면: 폰은 전체 폭, 태블릿·노트북은 가운데 672(전시 등록 등 다른 입력 화면과 같은 규칙) */
.page { width: 100%; max-width: 480px; min-height: 100dvh; margin-inline: auto; padding: max(8px, env(safe-area-inset-top)) var(--gx) 0; display: flex; flex-direction: column; }
@media (min-width: 768px) { :root { --gx: 32px; } .page { max-width: 672px; padding-top: 40px; } }
@media (min-width: 900px) { :root { --gx: 40px; } }

.bar { display: flex; align-items: center; gap: 2px; height: 56px; margin-left: -10px; }
.bar button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9999px; transition: background .2s; }
@media (hover: hover) { .bar button:hover { background: var(--bg-secondary); } }
.bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; } /* 11-07 Figma 대조(확인 후 적용): 18→20, Q1 700 */
.lead { margin-top: 8px; font-size: 20px; font-weight: 700; line-height: 1.4; letter-spacing: -0.03em; }
.lead + form .field:first-child { margin-top: 20px; }   /* 11-08 Figma: 제목 글 → 첫 라벨 20 */

form { flex: 1; display: flex; flex-direction: column; }
.fields { flex: 1; }
.field { margin-top: 24px; animation: rise .45s var(--ease) backwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.field > label, .field .lb { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 600; }
.field > label b, .field .lb b { font-weight: 600; }
.req { color: var(--notice); margin-left: 3px; }
.cnt { font-size: 12px; font-weight: 500; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.line { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.ul { position: relative; flex: 1; min-width: 0; display: flex; align-items: center; height: 47px; border-bottom: 1px solid var(--border-primary); transition: border-color .2s; }
.ul:focus-within { border-bottom-color: var(--text-primary); }
.field.err .ul { border-bottom-color: var(--notice); }
.ul input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 500; }
.ul input::placeholder { color: var(--text-teritary); }   /* 11-08: Figma Field과 같은 text/teritary */
.ul input[readonly] { color: var(--text-primary); }
.ul .i { width: 22px; height: 22px; color: var(--text-primary); }
.ul .tm { margin-left: 8px; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--text-secondary); }
.field.err .tm { color: var(--notice); }
.act { flex: none; min-width: 88px; height: 44px; padding: 0 16px; border-radius: var(--r12); background: var(--text-primary); color: #fff; font-size: 14px; font-weight: 600; transition: background .2s, color .2s, transform .2s var(--ease); }
@media (hover: hover) { .act:hover:not(:disabled) { background: #2f2f35; } }
.act:active:not(:disabled) { transform: scale(.97); }
.act:disabled { background: var(--bg-secondary); color: var(--text-disable); cursor: default; }
.help { margin-top: 4px; font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-secondary); }
.help.e { color: var(--notice); }

/* 학교 검색 목록 */
.combo { position: relative; }
.pop { position: absolute; z-index: 10; left: 0; right: 0; top: calc(100% + 8px); max-height: 288px; overflow-y: auto; padding: 6px 0; background: #fff; border: 1px solid var(--border-primary); border-radius: var(--r12); box-shadow: 0 12px 32px rgba(0, 0, 0, .08); animation: pop .2s var(--ease); overscroll-behavior: contain; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.pop button { display: block; width: 100%; height: 44px; padding: 0 12px; text-align: left; font-size: 14px; font-weight: 500; transition: background .15s; }
@media (hover: hover) { .pop button:hover, .pop button[aria-selected="true"] { background: var(--bg-secondary); } }
.pop .none { padding: 14px 12px; font-size: 14px; color: var(--text-teritary); }
.pop mark { background: none; font-weight: 600; color: inherit; }

/* 분야 칩 */
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
@media (min-width: 768px) { .chips { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.chip { height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; border: 1px solid var(--border-primary); border-radius: 8px; font-size: 14px; font-weight: 500; transition: background .2s, color .2s, border-color .2s, transform .2s var(--ease); }
@media (hover: hover) { .chip:hover { background: var(--bg-secondary); } }
.chip:active { transform: scale(.97); }
.chip[aria-pressed="true"] { background: var(--text-primary); border-color: var(--text-primary); color: #fff; }
.chip .i { width: 16px; height: 16px; stroke-width: 2.2; }
.chip.nudge { animation: nudge .3s var(--ease); }
@keyframes nudge { 30% { transform: translateX(-3px); } 65% { transform: translateX(3px); } }


/* 하단 버튼 */
.cta { position: sticky; bottom: 0; padding: 20px 0 max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to bottom, rgba(255,255,255,0), #fff 28%); }
.big { width: 100%; height: 48px; border-radius: var(--r12); background: var(--text-primary); color: #fff; font-size: 16px; font-weight: 600; transition: background .2s, color .2s, transform .2s var(--ease); }
@media (hover: hover) { .big:hover:not(:disabled) { background: #2f2f35; } }
.big:active:not(:disabled) { transform: scale(.99); }
.big:disabled { background: var(--bg-secondary); color: var(--text-disable); cursor: default; }
.demo { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; background: var(--bg-secondary); font-size: 12px; font-weight: 500; line-height: 1.4; color: var(--text-teritary); }
.demo b { color: var(--text-secondary); font-weight: 600; }

/* 스낵바 · 모달 */
.snack { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 12px); width: min(440px, calc(100vw - 40px)); padding: 14px 18px; border-radius: 8px; background: #000; color: #fff; font-size: 14px; font-weight: 500; line-height: 1.4; opacity: 0; pointer-events: none; z-index: 95; transition: opacity .25s, transform .35s var(--ease); }   /* 11-07 Figma 대조: 스낵바도 토스트와 같은 14/18 */
.snack.on { opacity: 1; transform: translate(-50%, 0); }
dialog.modal { width: min(322px, calc(100vw - 80px)); padding: 24px 20px 20px; border: 0; border-radius: var(--r20); background: #fff; color: var(--text-primary); animation: popm .25s var(--ease); }
dialog.modal::backdrop { background: rgba(0, 0, 0, .42); }
@keyframes popm { from { opacity: 0; transform: scale(.96); } }
.modal h2 { font-size: 20px; font-weight: 700; line-height: 1.4; } /* 11-07 Figma 대조(확인 후 적용) */
.modal p { margin-top: 8px; font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--text-teritary); }
.modal .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn { height: 44px; border-radius: var(--r12); font-size: 14px; font-weight: 600; transition: background .2s, transform .2s var(--ease); }
.btn:active { transform: scale(.98); }
.btn-soft { background: var(--bg-teritary); } .btn-soft:hover { background: #e4e4e7; }
.btn-dark { background: var(--text-primary); color: #fff; } .btn-dark:hover { background: #2f2f35; }

/* 완료 화면 */
.done { flex: 1; display: flex; flex-direction: column; }
.done .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 48px; }
.ring { position: relative; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 9999px; background: var(--text-primary); color: #fff; animation: dnRing .6s var(--ease) both; }   /* 11-08 Figma `Complete / 체크`: 검정 원 64 + 흰 체크 하나(이중 원 아님) */
.ring::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--text-primary); opacity: 0; animation: dnHalo .9s .18s var(--ease) both; z-index: -1; }
.ring .i { width: 28px; height: 28px; stroke-width: 2.4; stroke-dasharray: 26; stroke-dashoffset: 0; animation: draw .45s .3s var(--ease) backwards; }
@keyframes dnRing { from { transform: scale(.72); opacity: 0; } }
@keyframes dnUp { from { opacity: 0; transform: translateY(12px); } }
@keyframes dnHalo { from { opacity: .22; transform: scale(1); } to { opacity: 0; transform: scale(1.75); } }
@keyframes draw { from { stroke-dashoffset: 26; } }
.done h2 { margin-top: 24px; font-size: 20px; font-weight: 700; letter-spacing: -0.03em; animation: dnUp .5s .3s var(--ease) both; }
.done p { margin-top: 8px; font-size: 14px; font-weight: 400; color: var(--text-teritary); animation: dnUp .5s .36s var(--ease) both; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  </defs>
</svg>

<div class="page" id="page">
  <main id="main" style="flex:1;display:flex;flex-direction:column">
  <!-- 입력 화면 -->
  <section id="s-form" style="flex:1;display:flex;flex-direction:column">
    <div class="bar">
      <button type="button" id="back" aria-label="뒤로"><svg class="i"><use href="#i-back"/></svg></button>
      <h1>작가 인증</h1>
    </div>
    <p class="lead">작가 인증 정보를 입력해주세요</p>

    <form id="form" novalidate autocomplete="off">
      <div class="fields">
        <!-- 대학교 -->
        <div class="field" id="f-school">
          <label for="school"><span>대학교<span class="req" aria-hidden="true">*</span></span></label>
          <div class="combo">
            <div class="ul">
              <input id="school" type="text" role="combobox" aria-expanded="false" aria-controls="schools" aria-autocomplete="list" placeholder="학교명을 검색해주세요" enterkeyhint="search" spellcheck="false">
              <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
            </div>
            <div class="pop" id="schools" role="listbox" aria-label="대학교 검색 결과" hidden></div>
          </div>
        </div>

        <!-- 학교 이메일 -->
        <div class="field" id="f-email" hidden>
          <label for="email"><span>학교 이메일<span class="req" aria-hidden="true">*</span></span></label>
          <div class="line">
            <div class="ul"><input id="email" type="email" inputmode="email" autocapitalize="off" placeholder="school@univ.ac.kr" aria-describedby="h-email"></div>
            <button type="button" class="act" id="send" disabled>메일발송</button>
          </div>
          <p class="help" id="h-email" aria-live="polite"></p>
        </div>

        <!-- 인증번호 -->
        <div class="field" id="f-code" hidden>
          <label for="code"><span>인증번호<span class="req" aria-hidden="true">*</span></span></label>
          <div class="line">
            <div class="ul">
              <input id="code" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="인증번호 6자리" aria-describedby="h-code">
              <span class="tm" id="tm" role="timer" aria-live="off">05:00</span>
            </div>
            <button type="button" class="act" id="check" disabled>인증 확인</button>
          </div>
          <p class="help e" id="h-code" role="alert" hidden></p>
        </div>

        <!-- 프로필 (이메일 인증 후) -->
        <div class="field" id="f-name" hidden>
          <label for="pname"><span>작가 프로필명<span class="req" aria-hidden="true">*</span></span></label>
          <div class="ul" style="margin-top:8px"><input id="pname" type="text" maxlength="20" placeholder="작가 프로필명" autocomplete="off"></div>
        </div>

        <div class="field" id="f-field" hidden>
          <div class="lb"><span id="fl">작가 분야<span class="req" aria-hidden="true">*</span></span><span class="cnt" id="fcnt" aria-live="polite">0 / 2</span></div>
          <div class="chips" id="chips" role="group" aria-labelledby="fl"></div>
        </div>
      </div>

      <div class="cta">
        <p class="demo" id="demo"><b>데모용</b> 인증번호는 <b>123456</b>이에요 · <b>used@</b>로 시작하는 메일은 “이미 사용 중”, <b>fail@</b>로 시작하면 “발송 실패”를 보여줘요</p>
        <button type="submit" class="big" id="submit" disabled>인증 완료</button>
      </div>
    </form>
  </section>

  <!-- 완료 화면 -->
  <section id="s-done" class="done" hidden>
    <div class="mid">
      <div class="ring" aria-hidden="true"><svg class="i"><use href="#i-check"/></svg></div>
      <h2 tabindex="-1" id="done-h">작가 인증이 완료되었어요</h2>
      <p>전시 등록, 전시작 등록, 작가 프로필 관리가 가능해요!</p>
    </div>
    <div class="cta" style="display:grid;gap:8px"><a class="big" id="go" href="artist.html?me=1" style="display:grid;place-items:center">작가 프로필 가기</a><a class="big" id="ok" href="my.html?state=after" style="display:grid;place-items:center;background:var(--bg-teritary);color:var(--text-primary)">확인</a></div>
  </section>
  </main>
</div>

<div class="snack" id="snack" role="status" aria-live="polite"></div>
<dialog class="modal" id="leave" aria-labelledby="leave-t">
  <h2 id="leave-t">작가 인증을 그만할까요?</h2>
  <p>입력한 내용은 저장되지 않아요.</p>
  <div class="acts"><button type="button" class="btn btn-soft" id="stay">계속 작성</button><button type="button" class="btn btn-dark" id="exit">나가기</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
/* 이어질 화면: 마이에서 오면 인증 후 마이, 초대 수락에서 오면 초대함으로 */
const NEXT = q.get('next') && /^[\w.-]+\.html(\?[\w=&.-]*)?$/.test(q.get('next')) ? q.get('next') : 'my.html?state=after';
const BACK = q.get('from') && /^[\w.-]+\.html(\?[\w=&.-]*)?$/.test(q.get('from')) ? q.get('from') : 'my.html?state=before';
/* 이동 기록(11-08): 수정·인증 화면은 '거쳐 가는 화면'이라 기록에 남기지 않음 — 저장·나가기는 교체(replace), 온 곳이 돌아갈 곳이면 history.back()
   (이렇게 하지 않으면 작가 프로필에서 뒤로 가기를 눌렀을 때 방금 나온 수정 화면으로 되돌아감) */
const leaveTo = (dest) => { let ref = ''; try { const u = new URL(document.referrer); if (u.origin === location.origin) ref = u.pathname.split('/').pop(); } catch (e) {} if (ref && ref === dest.split('?')[0] && history.length > 1) history.back(); else location.replace(dest); };
$('ok').href = NEXT;

/* 데모용 학교(가상) — 실제 서비스에서는 학교 목록 API로 교체 */
const SCHOOLS = [
  { n: '한빛대학교', d: 'hanbit.ac.kr' }, { n: '한빛예술대학교', d: 'hanbitart.ac.kr' },
  { n: '새봄대학교', d: 'saebom.ac.kr' }, { n: '새봄디자인대학교', d: 'saebomdesign.ac.kr' },
  { n: '가온대학교', d: 'gaon.ac.kr' }, { n: '늘솔대학교', d: 'neulsol.ac.kr' },
  { n: '다온예술대학교', d: 'daonart.ac.kr' }, { n: '이음대학교', d: 'ieum.ac.kr' }
];
const FIELDS = ['회화', '조소', '사진', '그래픽', '브랜딩', '제품', '영상', '공간', '건축', 'UXUI', '공예', '기타'];
const MAX = 2, LIMIT = 300;

const st = { school: null, sent: false, verified: false, fields: new Set(), left: 0, timer: null };
const dirty = () => !!($('school').value || $('email').value || $('pname').value || st.fields.size);

/* ---------- 스낵바 ---------- */
let st1; function snack(msg) { const s = $('snack'); s.textContent = msg; s.classList.add('on'); clearTimeout(st1); st1 = setTimeout(() => s.classList.remove('on'), 2600); }

/* ---------- 학교 검색 ---------- */
const input = $('school'), pop = $('schools'); let act = -1, shown = [];
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function openList() {
  const v = input.value.trim();
  shown = v ? SCHOOLS.filter((s) => s.n.includes(v)) : SCHOOLS.slice(0, 6);
  act = -1;
  pop.innerHTML = shown.length
    ? shown.map((s, i) => `<button type="button" role="option" id="opt${i}" data-i="${i}">${v ? esc(s.n).replace(esc(v), '<mark>$&</mark>') : esc(s.n)}</button>`).join('')
    : '<p class="none">검색 결과가 없어요</p>';
  pop.hidden = false; input.setAttribute('aria-expanded', 'true');
}
function closeList() { pop.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); }
function pick(s) {
  st.school = s; input.value = s.n; closeList();
  if ($('f-email').hidden) { $('f-email').hidden = false; }
  $('email').focus(); update();
}
input.addEventListener('input', () => {
  if (st.school) { st.school = null; resetMail(true); }
  openList(); update();
});
input.addEventListener('focus', () => { if (!st.school) openList(); });
input.addEventListener('keydown', (e) => {
  if (pop.hidden) return;
  const opts = [...pop.querySelectorAll('[role=option]')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!opts.length) return;
    act = (act + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
    opts.forEach((o, i) => o.setAttribute('aria-selected', i === act));
    input.setAttribute('aria-activedescendant', opts[act].id); opts[act].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); const s = shown[act >= 0 ? act : (shown.length === 1 ? 0 : -1)]; if (s) pick(s); }
  else if (e.key === 'Escape') { closeList(); }
});
pop.addEventListener('mousedown', (e) => e.preventDefault());
pop.addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (b) pick(shown[+b.dataset.i]); });
document.addEventListener('click', (e) => { if (!e.target.closest('.combo')) closeList(); });

/* ---------- 이메일 · 인증번호 ---------- */
const email = $('email'), code = $('code');
const validMail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function setMailHelp(msg, err) { const h = $('h-email'); h.textContent = msg || ''; h.className = 'help' + (err ? ' e' : ''); $('f-email').classList.toggle('err', !!err); }
function resetMail(hideAll) {
  clearInterval(st.timer); st.sent = false; st.verified = false;
  $('f-code').hidden = true; code.value = ''; $('h-code').hidden = true; $('f-code').classList.remove('err');
  $('f-name').hidden = $('f-field').hidden = true;
  email.readOnly = false; $('send').hidden = false; $('send').textContent = '메일발송'; setMailHelp('');
  if (hideAll) { $('f-email').hidden = true; email.value = ''; }
}
email.addEventListener('input', () => {
  if (st.sent && !st.verified) { resetMail(false); }
  else setMailHelp('');
  update();
});
$('send').addEventListener('click', () => {
  const v = email.value.trim().toLowerCase();
  const dom = v.split('@')[1] || '';
  if (!(dom === st.school.d || dom.endsWith('.' + st.school.d))) { setMailHelp('선택한 학교의 웹메일과 일치하지 않아요.', true); return; }
  if (v.startsWith('used@')) { setMailHelp('이미 다른 계정에서 사용 중인 웹메일이에요.', true); return; }
  if (v.startsWith('fail@')) { setMailHelp(''); snack('메일을 보내지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
  const resend = st.sent;
  st.sent = true; setMailHelp('인증 메일을 발송했어요');
  $('send').textContent = '재발송'; $('f-code').hidden = false;
  code.value = ''; code.disabled = false; $('h-code').hidden = true; $('f-code').classList.remove('err');
  startTimer(); code.focus(); update();
  if (resend) snack('인증 메일을 다시 보냈어요');
});
function fmt(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function startTimer() {
  clearInterval(st.timer); st.left = LIMIT; $('tm').textContent = fmt(st.left);
  st.timer = setInterval(() => {
    st.left--; $('tm').textContent = fmt(Math.max(st.left, 0));
    if (st.left <= 0) { clearInterval(st.timer); expire(); }
  }, 1000);
}
function expire() {
  code.value = ''; code.disabled = true;
  const h = $('h-code'); h.textContent = '인증 시간이 지났어요. 인증 메일을 다시 받아주세요.'; h.hidden = false; $('f-code').classList.add('err'); update();
}
code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, ''); $('h-code').hidden = true; $('f-code').classList.remove('err'); update(); });
code.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (!$('check').disabled) $('check').click(); } });
$('check').addEventListener('click', () => {
  if (code.value !== '123456') { const h = $('h-code'); h.textContent = '인증번호가 일치하지 않아요.'; h.hidden = false; $('f-code').classList.add('err'); return; }
  clearInterval(st.timer); st.verified = true;
  $('f-code').hidden = true; email.readOnly = true; $('send').hidden = true;
  setMailHelp('학교 이메일 인증이 완료됐어요');
  $('f-name').hidden = false; $('f-field').hidden = false; $('pname').focus(); update();
});

/* ---------- 분야 칩 ---------- */
$('chips').innerHTML = FIELDS.map((f) => `<button type="button" class="chip" aria-pressed="false" data-f="${f}">${f}</button>`).join('');
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('.chip'); if (!b) return; const f = b.dataset.f;
  if (st.fields.has(f)) st.fields.delete(f);
  else if (st.fields.size >= MAX) { snack(`분야는 최대 ${MAX}개까지 선택할 수 있어요`); b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); return; }
  else st.fields.add(f);
  [...$('chips').children].forEach((c) => {
    const on = st.fields.has(c.dataset.f); c.setAttribute('aria-pressed', on);
    c.innerHTML = (on ? '<svg class="i" aria-hidden="true"><use href="#i-check"/></svg>' : '') + c.dataset.f;
  });
  update();
});
$('pname').addEventListener('input', update);

/* ---------- 상태 갱신 ---------- */
function update() {
  $('send').disabled = !(st.school && validMail(email.value.trim()));
  $('check').disabled = !(st.sent && !st.verified && code.value.length === 6 && st.left > 0);
  $('fcnt').textContent = `${st.fields.size} / ${MAX}`;
  $('submit').disabled = !(st.verified && $('pname').value.trim() && st.fields.size >= 1);
  $('demo').hidden = st.verified;
}

/* ---------- 제출 · 이탈 ---------- */
$('form').addEventListener('submit', (e) => {
  e.preventDefault(); if ($('submit').disabled) return;
  try { localStorage.setItem('du.cert', JSON.stringify({ school: st.school && st.school.n, name: $('pname').value.trim(), fields: [...st.fields], img: '' })); } catch (err) {}
  $('s-form').hidden = true; $('s-done').hidden = false; window.scrollTo(0, 0); $('done-h').focus({ preventScroll: true });
});
const leave = $('leave');
function tryLeave() { if (dirty()) { leave.showModal(); } else leaveTo(BACK); }
$('back').addEventListener('click', tryLeave);
$('stay').addEventListener('click', () => leave.close());
$('exit').addEventListener('click', () => leaveTo(BACK));
/* 완료 화면의 이동도 기록에서 인증 화면을 뺌: 작가 프로필 가기 → 거기서 뒤로 가면 마이 */
['go', 'ok'].forEach((id) => $(id).addEventListener('click', (e) => { e.preventDefault(); location.replace($(id).href); }));
leave.addEventListener('click', (e) => { if (e.target === leave) leave.close(); });
update();
</script>
<script src="assets/auth.js"></script>
<script src="assets/tap.js"></script>
