<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>고상준 · 작가 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 값은 Figma 변수(마이 - 작가 페이지 / 관람자 1120:8299, 1120:8320)에서 가져옴 */
:root {
  --text-primary: #18181b;
  --text-secondary: #3f3f47;
  --text-teritary: #71717b;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --bg-teritary: #f0f0f3;
  --link: #1d5fe0;
  --r4: 4px; --r8: 8px; --r12: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --pad: 20px;
  --top: 56px;
  --body: 14px;
  color-scheme: light;
}
@media (min-width: 768px) { :root { --pad: 32px; --top: 64px; } }
@media (min-width: 900px) { :root { --body: 16px; } }

*, *::before, *::after { box-sizing: border-box; letter-spacing: -0.03em; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--border-primary) transparent; scrollbar-width: thin; scroll-padding-top: 120px; }
body { margin: 0; background: #fff; color: var(--text-primary); font: 400 var(--body)/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; padding-bottom: 48px; }
::selection { background: var(--text-primary); color: #fff; }
a { color: inherit; text-decoration: none; }
button { font: inherit; letter-spacing: -0.03em; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, p, ul { margin: 0; padding: 0; }
ul { list-style: none; }
img { display: block; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -64px; z-index: 60; height: 44px; padding: 0 16px; display: inline-flex; align-items: center; background: var(--text-primary); color: #fff; border-radius: var(--r12); font-weight: 600; transition: top .2s var(--ease); }
.skip:focus-visible { top: 8px; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 상단: 모바일은 뒤로가기만, 태블릿 이상은 로고·검색 */
.top { position: sticky; top: 0; z-index: 30; height: var(--top); background: #fff; border-bottom: 1px solid var(--bg-teritary); }
.top .in { height: 100%; max-width: 1240px; margin-inline: auto; padding-inline: calc(var(--pad) - 8px) var(--pad); display: flex; align-items: center; gap: 4px; }
.back { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 9999px; transition: background .2s, transform .25s var(--ease); }
@media (hover: hover) { .back:hover { background: var(--bg-secondary); } }
.back:active { transform: scale(.94); }
.logo, .search { display: none; }
@media (min-width: 768px) {
  .top .in { padding-inline: var(--pad); justify-content: space-between; }
  .back { display: none; }
  .logo, .search { display: block; }
}

.layout { max-width: 1240px; margin-inline: auto; padding-inline: var(--pad); }
@media (min-width: 900px) {
  .layout { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); column-gap: 72px; padding-top: 40px; align-items: start; }
  .profile { position: sticky; top: calc(var(--top) + 32px); }
}

/* 프로필 */
.profile { padding-top: 24px; }
@media (min-width: 900px) { .profile { padding-top: 0; } }
/* 작가 프로필 머리(11-07 확정: Figma `작가 프로필 · 본인` 3378:93787): 왼쪽 이름·학교·소개, 오른쪽 사진 116×132 · 반경 12, 링크는 아래 전체 폭(간격 20) */
.profile { display: grid; grid-template-columns: minmax(0, 1fr) 116px; grid-template-rows: auto 1fr; column-gap: 16px; align-items: start; }
.avw { position: relative; grid-column: 2; grid-row: 1 / span 2; width: 116px; height: 132px; }
.avatar { position: relative; width: 116px; height: 132px; overflow: hidden; }   /* 11-12 작가 사진 모서리 0 (이전 12) */
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 900px) { .profile { display: flex; flex-direction: column; align-items: stretch; } .avw { order: -1; margin-bottom: 20px; } }   /* 노트북: 사진이 이름 위 */
.who { min-width: 0; grid-column: 1; grid-row: 1; }
.who h1 { font-size: 28px; line-height: 1.4; font-weight: 700; letter-spacing: -0.03em; }
@media (min-width: 900px) { .who h1 { font-size: 36px; } }
.school { margin-top: 4px; color: var(--text-secondary); font-size: 14px; font-weight: 500; }   /* 학교 · 분야를 한 줄로 */
.bio { grid-column: 1; grid-row: 2; margin-top: 20px; color: var(--text-primary); text-wrap: pretty; }
.linkbox { grid-column: 1 / -1; margin-top: 20px; }
.linkbox h2, .sec h2 { font-size: 18px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.sec h2 small { margin-left: 6px; font-size: 18px; font-weight: 500; color: var(--text-teritary); font-variant-numeric: tabular-nums; }
.links { margin-top: 8px; border-top: 1px solid var(--bg-teritary); }   /* 외부 링크: 서비스 이름 + 아이디, 줄 전체가 눌림 */
.links li { border-bottom: 1px solid var(--bg-teritary); }
.links a { display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 0; }
.links .lt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.links .lt b { font-size: 14px; font-weight: 600; }
.links .lt span { font-size: 12px; font-weight: 500; color: var(--text-teritary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links .out { width: 20px; height: 20px; color: var(--text-teritary); flex: none; transition: transform .25s var(--ease); }
@media (hover: hover) { .links a:hover .out { transform: translate(2px, -2px); color: var(--text-primary); } }
/* 작가 저장·수정 = 이름 줄 오른쪽 옆 아이콘 버튼 (11-08 Figma 확정 `Button / 프로필 행동 (이름 옆)`)
   보이는 회색 원 36 · 아이콘 20(선 2) · 누르는 영역 44. 본인 = 연필(프로필 수정), 방문자 = 북마크(작가 저장, 저장하면 채운 북마크 — 같은 회색 원).
   이름은 폭 안에서 최대 2줄, 넘으면 … (단어 중간에서 끊지 않음) */
.nm { display: flex; align-items: center; gap: 4px; }
.nm h1 { min-width: 0; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: keep-all; overflow-wrap: anywhere; }
.abtn { flex: none; position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 9999px; }
.abtn .dot { width: 36px; height: 36px; border-radius: 9999px; background: var(--bg-secondary); color: var(--text-primary); display: grid; place-items: center; transition: transform .2s var(--ease), background .2s; }
.abtn .i { width: 20px; height: 20px; stroke-width: 2; }
.abtn:active .dot { transform: scale(.94); }
@media (hover: hover) { .abtn:hover .dot { background: #e4e4e7; } }
.abtn[aria-pressed="true"] .i { fill: currentColor; }
.profile.nophoto { grid-template-columns: minmax(0, 1fr); }   /* 사진이 없으면 사진 칸 자체가 없고 글이 전체 폭 */

/* 전시 · 작품 섹션 (탭 없이 쌓음. 많아지면 "모두 보기") */
.content { min-width: 0; }
.sec { padding-top: 28px; }
@media (max-width: 899px) { #secs .sec:first-child { padding-top: 32px; } }   /* 11-08 Figma: 링크 줄 → "전시" 제목 글자 86(이전 82) */
.sec .body { margin-top: 12px; }
.more { display: flex; align-items: center; justify-content: center; width: 100%; height: 44px; margin-top: 12px; border-radius: 9999px; border: 1px solid var(--border-primary); font-size: 14px; font-weight: 600; }
@media (hover: hover) { .more:hover { background: var(--bg-secondary); } }
@media (min-width: 900px) { .sec:first-child { padding-top: 0; } }
/* 참여한 전시 */
.exh-list { display: grid; gap: 12px; }
.exh-list { gap: 0; }
.exh { display: grid; grid-template-columns: 72px minmax(0, 1fr) 20px; align-items: center; column-gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--bg-teritary); animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 60ms); }   /* 카드 테두리 없이 얇은 구분선만 */
.exh:first-child { padding-top: 16px; } .exh:last-child { border-bottom: 0; } .exh + .exh { margin-top: 12px; }   /* 11-07 Figma 위치 대조: 전시 행 위 16·행 사이 12 */
.exh img { width: 72px; height: auto; aspect-ratio: 402 / 568; object-fit: cover; background: var(--bg-secondary); }   /* 11-13 Figma `Card / 전시 행 · 일정 포함` 포스터: 모서리 0·외곽선 없음(이전: 1px 옅은 선 + 검정 배경) */
.exh .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; }
.exh .meta .sub { margin-top: 0; }
/* 11-09 날짜 글자: Figma `body/md/regular2`(12, 500, 자간 +1%)·`body/lg/regular2`(14, 400, 자간 0) — 숫자가 붙어 보이지 않게 기본 자간(-3%)을 쓰지 않음 */
.dt12 { font-weight: 500; letter-spacing: 0.01em; }
.dt14 { font-weight: 400; letter-spacing: 0; }
.exh .state { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--text-teritary); } /* 11-10 Figma `Card / 전시 행 · 일정 포함` 3135:37488: 세 상태 모두 #71717b (이전 전시 중·예정은 text-primary) */
.exh .state.end { color: var(--text-teritary); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 9999px; background: var(--text-primary); }
.dot.end { background: var(--border-primary); }
.dot.soon { background: transparent; box-shadow: inset 0 0 0 1.5px var(--text-primary); }
.exh strong { display: block; margin-top: 2px; font-size: 16px; font-weight: 600; line-height: 1.4; letter-spacing: -0.03em; }
.exh .sub { display: flex; align-items: center; gap: 4px; margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--text-secondary); }
.exh .sub .i { width: 13px; height: 13px; color: var(--text-teritary); }
.exh > .i { width: 18px; height: 18px; color: var(--text-teritary); transition: transform .3s var(--ease); }
@media (hover: hover) { .exh:hover > .i { transform: translateX(3px); } }
.exh:active strong { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }

/* 작품 */
.works { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; padding-inline: 4px; }   /* 11-08 Figma 작가 프로필 작품 카드: 안쪽 4 + 사이 16 → 카드 폭 169(글자 x24·x209) */
@media (min-width: 900px) { .works { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; padding-inline: 0; } }
.w { display: block; animation: rise .6s var(--ease) backwards; animation-delay: calc(var(--n, 0) * 60ms); }
.w .im { aspect-ratio: 3 / 4; overflow: hidden; background: var(--bg-secondary); }   /* 11-13 사진 외곽선 없음(카드 E, Figma `card / 참여 작품` 사진에 선·효과 없음) */
.w .im img { width: 100%; height: 100%; object-fit: cover; transition: transform .7s var(--ease); }   /* 11-13 카드 정책: 카드는 꽉 채워 자름(cover), 검정 띠 없음 — 탐색·홈 카드와 같음(이전: contain + 검정) */
@media (hover: hover) { .w:hover .im img { transform: scale(1.03); } }
.w b { display: block; margin-top: 10px; font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.w span { display: block; font-size: 12px; font-weight: 500; color: var(--text-teritary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.empty { padding: 56px 0; text-align: center; color: var(--text-teritary); }

/* 하단 바(본인 보기에서만) */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 70; padding: 14px 18px; border-radius: 8px; background: #000; color: #fff; font-size: 14px; font-weight: 500; line-height: 1.4; transition: opacity .25s, transform .35s var(--ease); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; } }
</style>

<script>
const q = new URLSearchParams(location.search);
const ic = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const O = 'assets/img/work/opt/';

/* ---------- 외부 링크 (작업 계정 — 방문자가 가장 많이 찾는 곳이라 소개 바로 아래) — ?links=0~3 로 개수 확인 ---------- */
/* 본인 보기(?me=1)는 프로필 수정에서 저장한 값(localStorage du.cert)을 먼저 보여줌: 이름·분야·소개·Instagram·Portfolio */
const MC = (() => { if (q.get('me') !== '1') return {}; try { return JSON.parse(localStorage.getItem('du.cert')) || {}; } catch (e) { return {}; } })();
const hostOf = (u) => u.replace(/^https?:\/\//i, '').replace(/\/$/, '');
const saved = ('ig' in MC || 'web' in MC);
const allLinks = saved ? [
  ...(MC.ig ? [{ name: 'Instagram', sub: '@' + MC.ig, href: 'https://www.instagram.com/' + MC.ig }] : []),
  ...(MC.web ? [{ name: 'Portfolio', sub: hostOf(MC.web), href: /^https?:/i.test(MC.web) ? MC.web : 'https://' + MC.web }] : [])
] : [
  { name: 'Instagram', sub: '@sangjun.works', href: 'https://www.instagram.com/sangjun.works' },
  { name: 'Portfolio', sub: 'sangjun-works.com', href: 'https://sangjun-works.com' },
  { name: '노션', sub: 'sangjun-works.notion.site', href: 'https://sangjun-works.notion.site' }
];
const nLinks = Math.max(0, Math.min(3, q.has('links') ? +q.get('links') : saved ? allLinks.length : 2));
const linksEl = document.getElementById('links');
linksEl.innerHTML = allLinks.slice(0, nLinks).map((l) => `<li><a href="${l.href}" target="_blank" rel="noopener noreferrer"><span class="lt"><b>${l.name}</b><span>${l.sub}</span></span>${ic('i-out', 'out')}<span class="sr">(새 창)</span></a></li>`).join('');
document.getElementById('linkbox').hidden = nLinks === 0;
/* 데모: 가상 계정이라 눌러도 이동하지 않고 안내만 */
let lkT = 0;
linksEl.addEventListener('click', (ev) => {
  if (!ev.target.closest('a')) return; ev.preventDefault();
  let el = document.getElementById('lk-toast');
  if (!el) { el = document.createElement('div'); el.id = 'lk-toast'; el.className = 'save-toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
  el.textContent = '데모라서 실제 링크로 이동하지 않아요'; el.classList.add('on'); clearTimeout(lkT); lkT = setTimeout(() => el.classList.remove('on'), 2600);
});

/* ---------- 참여한 전시 / 작품 (예시 데이터) ---------- */
const exOf = (e) => ({ img: e.img, pub: 100 - e.i, state: e.st, end: e.st === '종료', title: e.t, school: e.s, date: e.d, place: e.p });
/* 11-10 사용자 결정: 상태 순서 전시 중 → 전시 예정 → 종료(11-05 "상태와 상관없이 최신순"을 대체). 같은 상태 안에서는 최초 공개일 최신순(숫자 비교). 종료 = 회색 점·글자, Figma 작가 프로필 5장과 같은 순서 */
