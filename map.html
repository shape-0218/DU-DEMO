<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>지도 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 지도 화면 (11-06 개편) — Figma `지도 · 개선안 (11-06)`
   · 묶음 핀(숫자 핀)과 "여기 모인 전시 N개"는 뺐어요: 전시를 전부 그대로 표시(콜드 스타트에서는 전시가 적어 묶을 일이 거의 없고, 묶음 때문에 버그가 많았음)
   · 지도는 더 크게(시트 기본 높이를 낮춤, 처음엔 전시가 다 보이게 맞춤), 컨트롤(확대·축소 / 내 위치 / 전체 보기)은 폰에서도 항상 보임
   · 움직임: 끌기 관성, 휠·버튼·더블탭 확대가 목표값을 향해 부드럽게 따라감, 핀은 다시 그리지 않고 CSS로만 크기 유지
   지도 배경은 저작권 때문에 직접 그린 가상 지도(JS로 그림)이고, 위치는 가상 좌표입니다. 실제로는 지도 SDK + 전시 주소 좌표로 바뀌는 부분이에요. */
:root {
  --text-primary: #18181b;
  --text-teritary: #71717b;
  --text-quaternary: #d4d4d8;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --r12: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --out: cubic-bezier(.23, 1, .32, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --panel: 400px;
  --pw: var(--panel);   /* 지금 보이는 왼쪽 패널 폭 (접으면 0) */
  --is: 1;              /* 지도 확대 배율의 역수 (핀이 항상 같은 크기로 보이게) */
  --sh-float: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px rgba(0, 0, 0, .08), 0 12px 24px rgba(0, 0, 0, .06);
  --sh-pin: 0 1px 2px rgba(0, 0, 0, .14), 0 4px 10px rgba(0, 0, 0, .16);
  --sh-chip: 0 1px 2px rgba(0, 0, 0, .2), 0 2px 6px rgba(0, 0, 0, .14);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; letter-spacing: -0.03em; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #ebebe8; caret-color: var(--text-primary); color: var(--text-primary); font: 500 12px/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; letter-spacing: -0.03em; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, p { margin: 0; padding: 0; }
img { display: block; }
[hidden] { display: none !important; }
::selection { background: var(--text-primary); color: #fff; }
.body { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 지도 */
#map { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; outline: none; }
#map.drag { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#bg, #bg svg { display: block; }
#pins { position: absolute; left: 0; top: 0; width: 0; height: 0; }

/* 핀: 멀리서는 점, 가까이서는 포스터 핀. 위치는 지도 좌표, 크기는 --is 로 항상 일정 */
.pin, .me { position: absolute; width: 0; height: 0; padding: 0; z-index: var(--z, 1); }
.pk { position: absolute; left: 0; top: 0; width: 0; height: 0; transform: scale(var(--is)); transform-origin: 0 0; transition: opacity .25s var(--out); }
.pk::before { content: ""; position: absolute; left: -22px; top: -60px; width: 44px; height: 68px; }
.pin.off .pk { opacity: 0; pointer-events: none; }
.pin.off { pointer-events: none; }
.dotp { position: absolute; left: -7px; top: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--text-primary); box-shadow: 0 0 0 3px #fff, var(--sh-pin); opacity: 0; transform: scale(.4); transition: opacity .2s var(--out), transform .25s var(--out); }
.pin.soon .dotp { background: #fff; box-shadow: inset 0 0 0 3.5px var(--text-primary), 0 0 0 3px #fff, var(--sh-pin); }
.pc { position: absolute; left: -17px; top: -52px; width: 34px; height: 46px; padding: 2px; border-radius: 8px; background: #fff; box-shadow: var(--sh-pin); transform-origin: 50% 52px; transition: transform .28s var(--out), box-shadow .2s, background-color .2s, opacity .2s; }
.pc::after { content: ""; position: absolute; left: 50%; bottom: -10px; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; border-bottom: 0; transition: border-top-color .2s; }
.pc img { width: 100%; height: 100%; border-radius: 6px; object-fit: cover; background: #797979; }
.pc .dt { position: absolute; right: -4px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--text-primary); box-shadow: 0 0 0 2px #fff; }
.pin.soon .pc .dt { background: #fff; box-shadow: inset 0 0 0 2.5px var(--text-primary), 0 0 0 2px #fff; }
body.far .pin:not(.on) .dotp { opacity: 1; transform: none; }
body.far .pin:not(.on) .pc { opacity: 0; transform: scale(.5); pointer-events: none; }
@media (hover: hover) { .pin:hover .pc { transform: translateY(-2px) scale(1.07); } }
.pin:active .pc { transform: scale(.96); }
.pin.on { z-index: 9999; }
.pin.on .pc { transform: scale(1.3); background: #000; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
.pin.on .pc::after { border-top-color: #000; }
.pin.on .pc .dt { display: none; }
.st { position: absolute; left: 0; top: -92px; transform: translate(-50%, 4px); height: 22px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 11px; background: #fff; box-shadow: var(--sh-chip); font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; opacity: 0; pointer-events: none; transition: opacity .2s var(--out), transform .25s var(--out); }
.pin.on .st { opacity: 1; transform: translate(-50%, 0); }
.lb { position: absolute; left: 24px; top: -34px; font-size: 12px; font-weight: 600; line-height: 1.4; white-space: nowrap; color: var(--text-primary); text-shadow: 0 0 3px #ebebe8, 0 0 3px #ebebe8, 0 0 3px #ebebe8, 0 0 6px #ebebe8; opacity: 0; transition: opacity .2s var(--out); pointer-events: none; }
body.labels .pin:not(.on):not(.off) .lb { opacity: 1; }
.me { z-index: 1; pointer-events: none; }
.me i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #18181b; border: 3px solid #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .3); }
.me::before { content: ""; position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(24, 24, 27, .14); animation: pulse 2.4s var(--out) infinite; }
@keyframes pulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

/* 상단: 뒤로 + 검색 + 칩 */
.top { position: fixed; z-index: 20; left: 20px; right: 20px; top: calc(env(safe-area-inset-top) + 12px); display: grid; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.bar { display: flex; gap: 8px; align-items: center; }
.back { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #000; display: grid; place-items: center; color: #fff; transition: transform .2s var(--ease); box-shadow: var(--sh-float); }
.back:active { transform: scale(.96); }
.back svg { width: 24px; height: 24px; }
.search { flex: 1; position: relative; height: 44px; min-width: 0; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 22px; background: var(--bg-secondary); padding: 0 48px 0 20px; font-size: 16px; font-weight: 500; box-shadow: var(--sh-float); outline-offset: 2px; }
.search input::placeholder { color: #6b6b75; }
.search button, .search > svg { position: absolute; right: 12px; top: 10px; width: 24px; height: 24px; color: var(--text-teritary); }
.search button svg { width: 24px; height: 24px; }
.chips { display: flex; gap: 8px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #fff; color: var(--text-primary); font-size: 14px; font-weight: 600; box-shadow: var(--sh-float); transition: transform .2s var(--ease), background-color .2s, color .2s; }
.chip::after { content: ""; position: absolute; inset: -4px -2px; }
.chip b { font-weight: 600; color: var(--text-teritary); font-variant-numeric: tabular-nums; transition: color .2s; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: #000; color: #fff; }
.chip[aria-pressed="true"] b { color: var(--text-quaternary); }
.perm { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r12); background: #fff; box-shadow: var(--sh-float); }
.perm .ic { flex: none; width: 20px; height: 20px; color: var(--text-teritary); }
.perm .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.perm strong { font-size: 14px; font-weight: 600; line-height: 1.4; }
.perm span { font-size: 12px; color: var(--text-teritary); line-height: 1.4; }
.perm button { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: #000; color: #fff; font-size: 12px; font-weight: 600; }

/* 오른쪽 컨트롤: 확대·축소 / 내 위치 / 전체 보기 (폰에서도 항상 보임) */
.ctl { position: fixed; z-index: 30; right: 20px; bottom: calc(var(--vis, 300px) + 16px); display: grid; gap: 8px; transition: bottom .4s var(--ease); }
.ctl button { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--sh-float); transition: transform .2s var(--ease), opacity .2s, background-color .2s, color .2s; }
.ctl button:active { transform: scale(.94); }
.ctl svg { width: 24px; height: 24px; }
.ctl .zoom { display: grid; border-radius: 22px; background: #fff; box-shadow: var(--sh-float); overflow: hidden; }
.ctl .zoom button { border-radius: 0; box-shadow: none; }
.ctl .zoom button + button { border-top: 1px solid var(--bg-secondary); }
.ctl .zoom button[disabled] { opacity: .35; cursor: default; }
.ctl .loc[disabled] { opacity: .4; cursor: default; }
.ctl .loc[aria-pressed="true"] { background: #000; color: #fff; }

/* 바텀 시트 (폰) / 왼쪽 패널 (웹) */
.sheet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; height: calc(100dvh - 120px); background: #000; color: #fff; border-radius: 20px 20px 0 0; transform: translateY(calc(100% - var(--vis, 300px))); transition: transform .45s var(--ease); display: flex; flex-direction: column; box-shadow: 0 -4px 20px rgba(0, 0, 0, .25); padding-bottom: env(safe-area-inset-bottom); }
.sheet.dragging { transition: none; }
.grab { flex: none; padding: 10px 20px 0; touch-action: none; cursor: grab; }
.grab .h { width: 70px; height: 6px; border-radius: 3px; background: #3f3f46; margin: 0 auto 16px; }
.ttl { display: flex; align-items: center; justify-content: space-between; height: 20px; }
.ttl h2 { font-size: 14px; font-weight: 600; line-height: 1.4; }
.body { flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px 20px; display: grid; gap: 12px; align-content: start; }
.sheet.nt .ttl { display: none; }
.sheet.nt .grab .h { margin-bottom: 0; }
.sheet.full .body { overflow-y: auto; overscroll-behavior: contain; }
.cta { display: grid; place-items: center; height: 44px; border-radius: var(--r12); background: #fff; color: #000; font-size: 14px; font-weight: 600; transition: transform .2s var(--ease); }
.cta:active { transform: scale(.98); }
.more { justify-self: center; font-size: 12px; color: var(--text-teritary); text-decoration: underline; text-underline-offset: 2px; padding: 2px 8px; }
.empty { padding: 28px 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-teritary); }

.lcard { position: relative; display: grid; grid-template-columns: 86px minmax(0, 1fr); height: 124px; background: #18181b; border: 1px solid #27272a; border-radius: var(--r12); overflow: hidden; color: var(--text-quaternary); transition: border-color .2s, transform .3s var(--ease); text-align: left; width: 100%; }
.lcard:hover { border-color: #3f3f46; }
.lcard:active { transform: scale(.99); }
.lcard.on { border-color: #fff; border-width: 2px; }
.lcard .lp { position: relative; background: #797979; }
.lcard .lp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; outline: 1px solid rgba(255, 255, 255, .1); outline-offset: -1px; }
.lcard .lt { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding: 12px; }
.lcard .lt h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: -0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 56px; color: #fff; }
.lcard .lt .og { margin-top: 2px; font-size: 12px; font-weight: 500; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lt .mt { display: grid; gap: 2px; font-size: 12px; font-weight: 500; color: var(--text-teritary); }
.lcard .lt .mt p { display: flex; align-items: center; gap: 2px; min-width: 0; }
.lcard .lt .mt p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lt .mt img { width: 14px; height: 14px; flex: none; }
.lcard .lk { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; height: 25px; padding: 0 9px; border-radius: 9999px; background: rgba(255, 255, 255, .12); color: #d4d4d8; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }

.toast { position: fixed; z-index: 100; left: 50%; bottom: calc(var(--vis, 300px) + 80px); transform: translate(-50%, 8px); max-width: calc(100vw - 40px); padding: 12px 16px; border-radius: var(--r12); background: rgba(24, 24, 27, .94); color: #fff; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

body.folded { --pw: 0px; }
.fold { display: none; }
/* 웹: 왼쪽 패널 + 오른쪽 지도 */
@media (min-width: 768px) {
  .top { left: calc(var(--pw) + 20px); transition: left .4s var(--ease); }
  .sheet { right: auto; width: var(--panel); height: 100dvh; border-radius: 0; transform: none; box-shadow: 4px 0 20px rgba(0, 0, 0, .2); }
  .grab { cursor: default; touch-action: auto; padding-top: 28px; }
  .grab .h { display: none; }
  .body { overflow-y: auto; padding-bottom: 28px; }
  .ctl { bottom: 28px; }
  .toast { left: calc(50% + var(--pw) / 2); bottom: 40px; transition: left .4s var(--ease), opacity .25s, transform .3s var(--ease); }
  body.folded .sheet { transform: translateX(calc(-100% - 12px)); visibility: hidden; transition: transform .4s var(--ease), visibility 0s linear .4s; }
  .fold { display: grid; position: fixed; z-index: 45; left: var(--pw); top: 50%; width: 28px; height: 56px; margin-top: -28px; place-items: center; background: #fff; color: var(--text-teritary); border-radius: 0 12px 12px 0; box-shadow: var(--sh-float); transition: left .4s var(--ease), color .2s; }
  .fold::after { content: ""; position: absolute; inset: -4px -10px -4px 0; }
  .fold:hover { color: var(--text-primary); }
  .fold svg { width: 20px; height: 20px; transition: transform .4s var(--ease); }
  body.folded .fold svg { transform: rotate(180deg); }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation: none !important; } }
</style>
</head>
<body>
<div id="map" tabindex="0" role="application" aria-label="전시 지도 (끌어서 이동, +/− 키로 확대·축소)">
  <div id="world">
    <div id="bg" aria-hidden="true"></div>
    <div id="pins"></div>
  </div>
</div>

<div class="top">
  <div class="bar">
    <a class="back" id="back" href="home.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
    <label class="search"><span class="sr">전시 검색</span>
      <input id="q" type="search" placeholder="어떤 전시를 찾고 있나요?" autocomplete="off" enterkeyhint="search">
      <svg id="qi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </label>
  </div>
  <div class="perm" id="perm" hidden>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="m4 4 16 16"/></svg>
    <div class="tx"><strong>위치 권한이 꺼져 있어요</strong><span>가까운 전시를 먼저 보려면 설정에서 켜주세요</span></div>
    <button type="button" id="perm-open">설정 열기</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="전시 상태 (둘 다 안 누르면 전부 보여요)">
    <button class="chip" type="button" data-f="live" aria-pressed="false"><span>전시 중</span><b id="n-live">0</b></button>
    <button class="chip" type="button" data-f="soon" aria-pressed="false"><span>전시 예정</span><b id="n-soon">0</b></button>
  </div>
</div>

<div class="ctl" id="ctl">
  <div class="zoom"><button type="button" id="zin" aria-label="확대" title="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button><button type="button" id="zout" aria-label="축소" title="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button></div>
  <button type="button" id="fit" aria-label="전시 전체 보기" title="전시 전체 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V5.5A1.5 1.5 0 0 1 5.5 4H9M15 4h3.5A1.5 1.5 0 0 1 20 5.5V9M20 15v3.5a1.5 1.5 0 0 1-1.5 1.5H15M9 20H5.5A1.5 1.5 0 0 1 4 18.5V15"/><circle cx="12" cy="12" r="2"/></svg></button>
  <button type="button" class="loc" id="loc" aria-label="내 위치" title="내 위치" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<section class="sheet" id="sheet" aria-label="전시 목록">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="목록 크기 바꾸기">
    <div class="h"></div>
    <div class="ttl"><h2 id="ttl">이 지역 전시</h2></div>
  </div>
  <div class="body" id="body"></div>
</section>
<button type="button" class="fold" id="fold" aria-expanded="true" aria-controls="sheet" aria-label="목록 접기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/demo-data.js"></script>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const map = $('map'), world = $('world'), bg = $('bg'), pinsEl = $('pins'), sheet = $('sheet'), bodyEl = $('body'), ttl = $('ttl');
  const WW = 1800, WH = 2200;                       // 가상 지도 크기(좌표 단위, 예전보다 넓게)
  const OX = 400, OY = 500;                         // 전시가 모여 있는 곳의 오프셋(지도 가운데쯤)
  const ME = { x: 460 + OX, y: 680 + OY };          // 가상의 내 위치
  const M_PER_UNIT = 6;                             // 좌표 1 = 6m (거리 표시용)

  const visNow = () => sheetState === 'full' ? fullH() : VIS[sheetState];

  grab.addEventListener('pointermove', (ev) => { if (!gs) return; const d = gs.y - ev.clientY; if (Math.abs(d) > 4) gs.moved = true; const v = clamp(gs.vis + d, VIS.peek, fullH()); document.documentElement.style.setProperty('--vis', v + 'px'); gs.cur = v; });
  const gend = (ev) => { if (!gs) return; sheet.classList.remove('dragging'); const g = gs; gs = null;
    if (!g.moved) { cycle(); return; }
    const opts = sel && sel.via === 'pin' ? [['peek', VIS.peek], ['one', VIS.one]] : [['peek', VIS.peek], ['mid', VIS.mid], ['full', fullH()]];
    const vel = (g.vis - g.cur) / Math.max(1, ev.timeStamp - g.t);   // 빠르게 튕기면 방향대로
    const proj = g.cur + (-vel) * 120;
    const best = opts.reduce((a, b) => Math.abs(b[1] - proj) < Math.abs(a[1] - proj) ? b : a);
    setSheet(best[0]); };
  grab.addEventListener('pointerup', gend); grab.addEventListener('pointercancel', gend);
  const cycle = () => { if (DESK()) return; if (sel && sel.via === 'pin') setSheet(sheetState === 'peek' ? 'one' : 'peek'); else setSheet(sheetState === 'mid' ? 'full' : sheetState === 'full' ? 'peek' : 'mid'); };
  grab.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); cycle(); } });

  /* ---- 칩·검색·위치·뒤로 ---- */
  $('chips').addEventListener('click', (ev) => {
    const b = ev.target.closest('.chip'); if (!b) return;
    const k = b.dataset.f; if (fl.has(k)) fl.delete(k); else fl.add(k);   // 다시 누르면 해제
    if (sel && !matches(byId.get(sel.id))) sel = null;
    items = ALL.filter(matches); refresh();
    if (items.length) fit(items);
  });
  let qt = 0;
  $('q').addEventListener('input', (ev) => {
    query = ev.target.value.replace(/\s/g, '').toLowerCase(); sel = null; items = ALL.filter(matches); refresh();
    clearTimeout(qt); qt = setTimeout(() => { if (items.length) fit(items); }, 300);   // 검색하면 결과가 다 보이게 지도가 움직임
  });
  $('loc').onclick = () => {
    if (!PERM) { toast('위치 권한이 꺼져 있어요'); return; }
    locOn = true; $('loc').setAttribute('aria-pressed', 'true'); sel = null; paintPins(); renderSheet(true);
    goTo({ s: Math.max(tgt.s, 1.4), cx: ME.x, cy: ME.y - 10 }, { tau: 120 });
  };
  if (!PERM) { $('perm').hidden = false; $('loc').disabled = true; $('loc').setAttribute('aria-label', '내 위치 (위치 권한이 꺼져 있어요)'); }
  $('perm-open').onclick = () => toast('기기 설정에서 위치를 켜주세요 (데모)');
  $('back').addEventListener('click', (ev) => { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { ev.preventDefault(); history.back(); } });
  let tt = 0; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; reanchor(() => { visPx = sheetState === 'full' ? H - 120 : VIS[sheetState]; }); document.documentElement.style.setProperty('--vis', visPx + 'px'); fix(cur); Object.assign(tgt, cur); apply(); renderSheet(true); });

  /* ---- 왼쪽 패널 접기/펼치기 (웹) ---- */
  function setFold(on, save) {
    if (on === folded()) return;
    reanchor(() => document.body.classList.toggle('folded', on));   // 접어도 지도는 제자리(지도는 원래 화면 전체 뒤에 깔려 있음)
    apply();
    const b = $('fold'); b.setAttribute('aria-expanded', String(!on)); b.setAttribute('aria-label', on ? '목록 펼치기' : '목록 접기');
    if (save) { try { localStorage.setItem('du.mapfold', on ? '1' : '0'); } catch (e) {} }
    renderSheet(true);
  }
  $('fold').onclick = () => setFold(!folded(), true);
  try { if (DESK() && localStorage.getItem('du.mapfold') === '1') document.body.classList.add('folded'), $('fold').setAttribute('aria-expanded', 'false'), $('fold').setAttribute('aria-label', '목록 펼치기'); } catch (e) {}

  /* ---- 시작: 처음엔 전시가 전부 보이게 맞춤 ---- */
  buildPins();
  visPx = VIS.mid; document.documentElement.style.setProperty('--vis', visPx + 'px'); sheet.classList.toggle('full', false);
  paintPins(); items = ALL.filter(matches);
  const z0 = +P.get('z');
  if (z0) { goTo({ s: z0, cx: 900, cy: 1150 }, { instant: true }); } else fit(items, true);
  refresh();
  const first = P.get('ex');
  if (first !== null && byId.has(+first)) selectEx(+first, 'pin');
})();
</script>
</body>
