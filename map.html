<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>지도 · Display U.</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 지도 화면 — Figma `지도 · 개선안 (11-05)` 3033:35905 (기본·핀 선택·목록에서 선택·시트 접힘/펼침·위치 권한 꺼짐·묶음 핀·필터 칩)
   지도 배경은 저작권 때문에 직접 그린 가상 지도(JS로 그림)이고, 위치는 가상 좌표입니다. 실제로는 지도 SDK + 전시 주소 좌표로 바뀌는 부분이에요. */
:root {
  --text-primary: #18181b;
  --text-teritary: #71717b;
  --text-quaternary: #d4d4d8;
  --border-primary: #d4d4d8;
  --bg-secondary: #f4f4f5;
  --r12: 12px;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --panel: 400px;
  --pw: var(--panel);   /* 지금 보이는 왼쪽 패널 폭 (접으면 0) */
  /* 겹겹이 얇게 쌓은 그림자(테두리 대신 깊이로 구분) */
  --sh-float: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 12px rgba(0, 0, 0, .08), 0 12px 24px rgba(0, 0, 0, .06);
  --sh-pin: 0 1px 2px rgba(0, 0, 0, .14), 0 4px 10px rgba(0, 0, 0, .16);
  --sh-chip: 0 1px 2px rgba(0, 0, 0, .2), 0 2px 6px rgba(0, 0, 0, .14);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: #ebebe8; caret-color: var(--text-primary); color: var(--text-primary); font: 500 12px/1.4 var(--font); letter-spacing: -0.03em; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
a, button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, p { margin: 0; padding: 0; }
img { display: block; }
[hidden] { display: none !important; }
::selection { background: var(--text-primary); color: #fff; }
.body { scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }
:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* 지도 */
#map { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.drag { cursor: grabbing; }
#bg { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#bg svg { display: block; }
#pins { position: absolute; left: 0; top: 0; will-change: transform; }
.pin, .cl, .me { position: absolute; left: 0; top: 0; width: 0; height: 0; padding: 0; }
.pin .pb { position: absolute; left: -18px; top: -47px; width: 36px; height: 47px; transition: transform .25s var(--ease); transform-origin: 50% 100%; }
.pin .pb svg { width: 100%; height: 100%; overflow: visible; display: block; }
.pin .pb path { fill: var(--text-teritary); }
.pin .pb circle { fill: #fafafa; }
.pin::before, .cl::before { content: ""; position: absolute; left: -22px; top: -48px; width: 44px; height: 52px; }
.pin.on { z-index: 5; }
.pin.on .pb { left: -24px; top: -64px; width: 49px; height: 64px; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .28)); }
.pin.on .pb path { fill: var(--text-primary); stroke: #fff; stroke-width: 6; paint-order: stroke; }
.pin.on .pb circle { display: none; }
.pin .po { display: none; position: absolute; left: -18px; top: -58px; width: 37px; height: 37px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; background: #797979; z-index: 1; }
.pin.on .po { display: block; }
.pin .st { display: none; position: absolute; left: -3px; top: -68px; z-index: 2; height: 16px; padding: 0 6px; align-items: center; border-radius: 8px; background: #fff; box-shadow: var(--sh-chip); font-size: 10px; font-weight: 700; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pin.on .st { display: inline-flex; }
.cl { z-index: 2; }
.cl .cc { position: absolute; left: -20px; top: -20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: var(--text-primary); font-size: 14px; font-weight: 700; box-shadow: var(--sh-pin); font-variant-numeric: tabular-nums; transition: transform .25s var(--ease), background-color .2s, color .2s; }
.cl:active .cc { transform: scale(.96); }
.cl.on { z-index: 5; }
.cl.on .cc { background: #000; color: #fff; }
.me { z-index: 1; pointer-events: none; }
.me i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: #18181b; border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(24, 24, 27, .14), 0 2px 6px rgba(0, 0, 0, .3); }

/* 상단: 뒤로 + 검색 + 칩 */
.top { position: fixed; z-index: 20; left: 20px; right: 20px; top: calc(env(safe-area-inset-top) + 12px); display: grid; gap: 12px; pointer-events: none; }
.top > * { pointer-events: auto; }
.bar { display: flex; gap: 8px; align-items: center; }
.back { flex: none; width: 44px; height: 44px; border-radius: 50%; background: #000; display: grid; place-items: center; color: #fff; transition: transform .2s var(--ease); }
.back { box-shadow: var(--sh-float); }
.back:active { transform: scale(.96); }
.back svg { width: 24px; height: 24px; }
.search { flex: 1; position: relative; height: 44px; min-width: 0; }
.search input { width: 100%; height: 44px; border: 0; border-radius: 22px; background: var(--bg-secondary); padding: 0 48px 0 20px; font-size: 16px; font-weight: 500; box-shadow: var(--sh-float); outline-offset: 2px; }
.search input::placeholder { color: #6b6b75; }
.search button, .search > svg { position: absolute; right: 12px; top: 10px; width: 24px; height: 24px; color: var(--text-teritary); }
.search button svg { width: 24px; height: 24px; }
.chips { display: flex; gap: 8px; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 18px; background: #fff; color: var(--text-primary); font-size: 14px; font-weight: 600; box-shadow: var(--sh-float); transition: transform .2s var(--ease), background-color .2s, color .2s; }
.chip::after { content: ""; position: absolute; inset: -4px -2px; }
.chip b { font-weight: 600; color: var(--text-teritary); font-variant-numeric: tabular-nums; transition: color .2s; }
.chip:active { transform: scale(.96); }
.chip[aria-pressed="true"] { background: #000; color: #fff; }
.chip[aria-pressed="true"] b { color: var(--text-quaternary); }
.perm { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r12); background: #fff; box-shadow: var(--sh-float); }
.perm .ic { flex: none; width: 20px; height: 20px; color: var(--text-teritary); }
.perm .tx { flex: 1; min-width: 0; display: grid; gap: 2px; }
.perm strong { font-size: 14px; font-weight: 600; line-height: 1.4; }
.perm span { font-size: 12px; color: var(--text-teritary); line-height: 1.4; }
.perm button { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: #000; color: #fff; font-size: 12px; font-weight: 600; }

/* 오른쪽 컨트롤 (내 위치, 확대/축소) */
.ctl { position: fixed; z-index: 30; right: 20px; bottom: calc(var(--vis, 341px) + 16px); display: grid; gap: 8px; transition: bottom .35s var(--ease); }
.ctl button { width: 44px; height: 44px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: var(--sh-float); transition: transform .2s var(--ease), opacity .2s; }
.ctl button:active { transform: scale(.96); }
.ctl svg { width: 24px; height: 24px; }
.ctl .zoom { display: none; border-radius: 22px; background: #fff; box-shadow: var(--sh-float); overflow: hidden; }
.ctl .zoom button { border-radius: 0; box-shadow: none; }
.ctl .zoom button + button { border-top: 1px solid var(--bg-secondary); }
@media (hover: hover) and (pointer: fine) { .ctl .zoom { display: grid; } }
.ctl .loc[disabled] { opacity: .4; cursor: default; }
.ctl .loc[aria-pressed="true"] { background: #000; color: #fff; }

/* 바텀 시트 (폰) / 왼쪽 패널 (웹) */
.sheet { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; height: calc(100dvh - 120px); background: #000; color: #fff; border-radius: 20px 20px 0 0; transform: translateY(calc(100% - var(--vis, 341px))); transition: transform .4s var(--ease); display: flex; flex-direction: column; box-shadow: 0 -4px 20px rgba(0, 0, 0, .25); padding-bottom: env(safe-area-inset-bottom); }
.sheet.dragging { transition: none; }
.grab { flex: none; padding: 10px 20px 0; touch-action: none; cursor: grab; }
.grab .h { width: 70px; height: 6px; border-radius: 3px; background: #3f3f46; margin: 0 auto 16px; }
.ttl { display: flex; align-items: center; justify-content: space-between; height: 20px; }
.ttl h2 { font-size: 14px; font-weight: 600; line-height: 20px; }
.body { flex: 1; min-height: 0; overflow: hidden; padding: 16px 20px 20px; display: grid; gap: 12px; align-content: start; }
.sheet.nt .ttl { display: none; }
.sheet.nt .grab .h { margin-bottom: 0; }
.sheet.full .body { overflow-y: auto; overscroll-behavior: contain; }
.cta { display: grid; place-items: center; height: 44px; border-radius: var(--r12); background: #fff; color: #000; font-size: 14px; font-weight: 600; transition: transform .2s var(--ease); }
.cta:active { transform: scale(.98); }
.more { justify-self: center; font-size: 12px; color: var(--text-teritary); text-decoration: underline; text-underline-offset: 2px; padding: 2px 8px; }
.empty { padding: 28px 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--text-teritary); }

.lcard { position: relative; display: grid; grid-template-columns: 86px minmax(0, 1fr); height: 124px; background: #18181b; border: 1px solid #27272a; border-radius: var(--r12); overflow: hidden; color: var(--text-quaternary); transition: border-color .2s, transform .3s var(--ease); text-align: left; width: 100%; }
.lcard:hover { border-color: #3f3f46; }
.lcard:active { transform: scale(.99); }
.lcard.on { border-color: #fff; border-width: 2px; }
.lcard .lp { position: relative; background: #797979; }
.lcard .lp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; outline: 1px solid rgba(255, 255, 255, .1); outline-offset: -1px; }
.lcard .lt { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; padding: 12px; }
.lcard .lt h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 600; letter-spacing: -0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 56px; color: #fff; }
.lcard .lt .og { margin-top: 2px; font-size: 12px; font-weight: 500; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lt .mt { display: grid; gap: 2px; font-size: 12px; font-weight: 500; color: var(--text-teritary); }
.lcard .lt .mt p { display: flex; align-items: center; gap: 2px; min-width: 0; }
.lcard .lt .mt p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lcard .lt .mt img { width: 14px; height: 14px; flex: none; }
.lcard .lk { position: absolute; right: 12px; top: 12px; display: inline-flex; align-items: center; height: 25px; padding: 0 9px; border-radius: 9999px; background: rgba(255, 255, 255, .12); color: #d4d4d8; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }

.toast { position: fixed; z-index: 100; left: 50%; bottom: calc(var(--vis, 341px) + 80px); transform: translate(-50%, 8px); max-width: calc(100vw - 40px); padding: 12px 16px; border-radius: var(--r12); background: rgba(24, 24, 27, .94); color: #fff; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .3s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

body.folded { --pw: 0px; }
.fold { display: none; }
/* 웹: 왼쪽 패널 + 오른쪽 지도 */
@media (min-width: 768px) {
  .top { left: calc(var(--pw) + 20px); transition: left .4s var(--ease); }
  .sheet { right: auto; width: var(--panel); height: 100dvh; border-radius: 0; transform: none; box-shadow: 4px 0 20px rgba(0, 0, 0, .2); }
  .grab { cursor: default; touch-action: auto; padding-top: 28px; }
  .grab .h { display: none; }
  .body { overflow-y: auto; padding-bottom: 28px; }
  .ctl { bottom: 28px; }
  .toast { left: calc(50% + var(--pw) / 2); bottom: 40px; transition: left .4s var(--ease), opacity .25s, transform .3s var(--ease); }
  /* 왼쪽 패널 접기 (구글·네이버 지도처럼 가장자리 탭) */
  body.folded .sheet { transform: translateX(calc(-100% - 12px)); visibility: hidden; transition: transform .4s var(--ease), visibility 0s linear .4s; }
  .fold { display: grid; position: fixed; z-index: 45; left: var(--pw); top: 50%; width: 28px; height: 56px; margin-top: -28px; place-items: center; background: #fff; color: var(--text-teritary); border-radius: 0 12px 12px 0; box-shadow: var(--sh-float); transition: left .4s var(--ease), color .2s; }
  .fold::after { content: ""; position: absolute; inset: -4px -10px -4px 0; }
  .fold:hover { color: var(--text-primary); }
  .fold svg { width: 20px; height: 20px; transition: transform .4s var(--ease); }
  body.folded .fold svg { transform: rotate(180deg); }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div id="map" aria-label="전시 지도">
  <div id="bg" aria-hidden="true"></div>
  <div id="pins"></div>
</div>

<div class="top">
  <div class="bar">
    <a class="back" id="back" href="home.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
    <label class="search"><span class="sr">전시 검색</span>
      <input id="q" type="search" placeholder="어떤 전시를 찾고 있나요?" autocomplete="off" enterkeyhint="search">
      <svg id="qi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    </label>
  </div>
  <div class="perm" id="perm" hidden>
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><path d="m4 4 16 16"/></svg>
    <div class="tx"><strong>위치 권한이 꺼져 있어요</strong><span>가까운 전시를 먼저 보려면 설정에서 켜주세요</span></div>
    <button type="button" id="perm-open">설정 열기</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="전시 상태 (둘 다 안 누르면 전부 보여요)">
    <button class="chip" type="button" data-f="live" aria-pressed="false"><span>전시 중</span><b id="n-live">0</b></button>
    <button class="chip" type="button" data-f="soon" aria-pressed="false"><span>전시 예정</span><b id="n-soon">0</b></button>
  </div>
</div>

<div class="ctl" id="ctl">
  <div class="zoom"><button type="button" id="zin" aria-label="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></button><button type="button" id="zout" aria-label="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 12h12"/></svg></button></div>
  <button type="button" class="loc" id="loc" aria-label="내 위치" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<section class="sheet" id="sheet" aria-label="전시 목록">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="목록 크기 바꾸기">
    <div class="h"></div>
    <div class="ttl"><h2 id="ttl">이 지역 전시</h2></div>
  </div>
  <div class="body" id="body"></div>
</section>
<button type="button" class="fold" id="fold" aria-expanded="true" aria-controls="sheet" aria-label="목록 접기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/demo-data.js"></script>
<script>
(() => {
  const P = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const map = $('map'), bg = $('bg'), pinsEl = $('pins'), sheet = $('sheet'), bodyEl = $('body'), ttl = $('ttl');
  const WW = 1000, WH = 1200;                       // 가상 지도 크기(좌표 단위)
  const ME = { x: 470, y: 700 };                    // 가상의 내 위치
  const M_PER_UNIT = 6;                             // 좌표 1 = 6m (거리 표시용)
  const PERM = P.get('perm') !== '0';               // ?perm=0 : 위치 권한 꺼짐
  const DESK = () => matchMedia('(min-width: 768px)').matches;

  /* 전시별 가상 좌표 (DEMO.EXH 순서): 같은 대학 안의 전시는 가깝게 두어 멀리서 보면 묶음 핀이 되도록 */
  const XY = [[500, 620], [522, 640], [300, 520], [700, 420], [478, 598], [330, 820], [284, 545], null, [722, 444], null, [350, 838], [640, 760], [780, 640], [680, 398], [262, 500]];
  const ALL = DEMO.EXH.map((e, i) => (XY[i] && e.st !== '종료') ? { ...e, x: XY[i][0], y: XY[i][1] } : null).filter(Boolean);   // 종료된 전시는 지도에 안 나옴(정책)
  const byId = new Map(ALL.map((e) => [e.i, e]));

  /* ---- 상태 ---- */
  const fl = new Set(['live', 'soon'].includes(P.get('f')) ? [P.get('f')] : []);   // 비어 있으면 전부
  let query = '';
  let s = Math.min(2.5, Math.max(0.5, +P.get('z') || 0.75));
  let cx = 500, cy = 600;                           // 화면 가운데에 오는 지도 좌표
  let sel = null;                                   // {t:'ex', id, via:'pin'|'list'} | {t:'cl', ids, key}
  let sheetState = 'mid';                           // peek | one | mid | full
  let locOn = false;
  let W = innerWidth, H = innerHeight;
  let items = [], groups = [];

  const dist = (e) => Math.round(Math.hypot(e.x - ME.x, e.y - ME.y) * M_PER_UNIT);
  const fmtDist = (m) => m < 1000 ? Math.max(10, Math.round(m / 10) * 10) + 'm' : (m / 1000).toFixed(1) + 'km';
  const stText = (e) => e.st === '전시 예정' ? '예정' : e.daysLeft <= 7 ? (e.daysLeft === 0 ? 'D-DAY' : 'D-' + e.daysLeft) : '전시 중';   // ❓ 임시 문구
  const qOk = (e) => !query || (e.t + e.s + e.p).replace(/\s/g, '').toLowerCase().includes(query);
  const matches = (e) => (!fl.size || fl.has(e.st === '전시 예정' ? 'soon' : 'live')) && qOk(e);

  /* ---- 가상 지도 그리기 (직접 만든 그림, 실제 지도 아님) ---- */
  (function drawBg() {
    /* 포스터 색이 돋보이도록 지도는 거의 무채색으로 조용하게: 얇은 길, 연한 구획, 작은 지명 */
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    let o = `<svg width="${WW}" height="${WH}" viewBox="0 0 ${WW} ${WH}" xmlns="http://www.w3.org/2000/svg"><rect width="${WW}" height="${WH}" fill="#ebebe8"/>`;
    for (let i = 0; i < 220; i++) { const w = 14 + rnd() * 34, h = 12 + rnd() * 30; o += `<rect x="${(rnd() * WW).toFixed(0)}" y="${(rnd() * WH).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" rx="2" fill="#e3e3df"/>`; }
    o += `<path d="M-20 980 C 220 900 420 1060 640 930 S 900 860 1040 900" fill="none" stroke="#d9dee1" stroke-width="56" stroke-linecap="round"/>`;
    for (const [x, y, w, h] of [[120, 120, 160, 120], [760, 140, 150, 110], [430, 960, 140, 90], [820, 520, 110, 150], [150, 700, 110, 100]]) o += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="#dfe2dc"/>`;
    for (let i = 0; i < 17; i++) { const y = 50 + i * 72 + (rnd() * 16 - 8); o += `<path d="M-10 ${y.toFixed(0)} Q ${WW / 2} ${(y + rnd() * 24 - 12).toFixed(0)} ${WW + 10} ${(y + rnd() * 20 - 10).toFixed(0)}" fill="none" stroke="#f6f6f4" stroke-width="3"/>`; }
    for (let i = 0; i < 14; i++) { const x = 40 + i * 76 + (rnd() * 16 - 8); o += `<path d="M${x.toFixed(0)} -10 Q ${(x + rnd() * 24 - 12).toFixed(0)} ${WH / 2} ${(x + rnd() * 20 - 10).toFixed(0)} ${WH + 10}" fill="none" stroke="#f6f6f4" stroke-width="3"/>`; }
    for (const d of ['M-20 330 L 1020 760', 'M300 -20 L 700 1220']) o += `<path d="${d}" stroke="#d5d5d0" stroke-width="13" fill="none"/><path d="${d}" stroke="#fbfbfa" stroke-width="10" fill="none"/>`;
    for (const [x, y, t] of [[430, 585, '한결대학교'], [640, 405, '가온대학교'], [200, 505, '새봄여자대학교'], [300, 800, '다온대학교'], [560, 760, '예술로'], [680, 915, '봄내천'], [770, 625, '중앙시장']]) o += `<text x="${x}" y="${y}" font-size="11" font-weight="600" letter-spacing=".02em" fill="#8f8f8a" font-family="Pretendard Variable, sans-serif" paint-order="stroke" stroke="#ebebe8" stroke-width="3">${t}</text>`;
    bg.innerHTML = o + '</svg>';
  })();

  /* ---- 좌표 변환 ---- */
  const folded = () => document.body.classList.contains('folded');
  const PW = () => (DESK() && !folded()) ? 400 : 0;
  const vc = () => DESK() ? { x: PW() + (W - PW()) / 2, y: H / 2 } : { x: W / 2, y: (H - 341) / 2 + 40 };
  const tx = () => vc().x - cx * s, ty = () => vc().y - cy * s;
  const toScreen = (e) => ({ x: e.x * s + tx(), y: e.y * s + ty() });
  function applyTransform() {
    const x = tx(), y = ty();
    bg.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    pinsEl.style.transform = `translate(${x}px, ${y}px)`;
  }

  /* ---- 묶기: 화면에서 40px 안에 모이는 핀은 숫자 핀 하나로 ---- */
  function cluster() {
    items = ALL.filter(matches);
    const used = new Set(); groups = [];
    for (const e of items) {
      if (used.has(e.i)) continue;
      const g = [e]; used.add(e.i);
      for (const f of items) if (!used.has(f.i) && Math.hypot((e.x - f.x) * s, (e.y - f.y) * s) < 40) { g.push(f); used.add(f.i); }
      const mx = g.reduce((a, b) => a + b.x, 0) / g.length, my = g.reduce((a, b) => a + b.y, 0) / g.length;
      groups.push({ ids: g.map((x) => x.i).sort((a, b) => a - b), list: g, x: mx, y: my });
    }
  }
  const isSelGroup = (g) => sel && ((sel.t === 'cl' && sel.key === g.ids.join(',')) || (sel.t === 'ex' && g.ids.includes(sel.id) && g.ids.length > 1));
  const PIN_D = 'M24.5 0C11 0 0 11 0 24.5c0 17 17.5 28 24.5 39.5C31.5 52.5 49 41.5 49 24.5C49 11 38 0 24.5 0z';
  function renderPins() {
    cluster();
    let h = '';
    for (const g of groups) {
      const px = (g.x * s).toFixed(1), py = (g.y * s).toFixed(1);
      if (g.ids.length > 1) {
        h += `<button type="button" class="cl${isSelGroup(g) ? ' on' : ''}" style="transform:translate(${px}px,${py}px)" data-key="${g.ids.join(',')}" aria-label="전시 ${g.ids.length}개가 모여 있어요"><span class="cc">${g.ids.length}</span></button>`;
      } else {
        const e = g.list[0], on = sel && sel.t === 'ex' && sel.id === e.i;
        h += `<button type="button" class="pin${on ? ' on' : ''}" style="transform:translate(${px}px,${py}px)" data-id="${e.i}" aria-label="${e.t}"><span class="pb"><svg viewBox="0 0 49 64" aria-hidden="true"><path d="${PIN_D}"/><circle cx="24.5" cy="24.5" r="11"/></svg></span><img class="po" src="${DEMO.src(e.img)}" alt="" draggable="false"><span class="st">${stText(e)}</span></button>`;
      }
    }
    if (locOn && PERM) h += `<div class="me" style="transform:translate(${(ME.x * s).toFixed(1)}px,${(ME.y * s).toFixed(1)}px)"><i></i></div>`;
    pinsEl.innerHTML = h;
    applyTransform();
  }

  /* ---- 시트 ---- */
  const card = (e, on) => `<${on === null ? 'a href="exhibition.html"' : 'button type="button"'} class="lcard${on ? ' on' : ''}" data-id="${e.i}" aria-label="${e.t}${on ? ' (선택됨, 한 번 더 누르면 상세로 이동)' : ''}"><span class="lp"><img src="${DEMO.src(e.img)}" alt="" loading="lazy" draggable="false"></span><span class="lt"><span><h3>${e.t}</h3><p class="og">${e.s}</p></span><span class="mt"><p><img src="assets/img/icon-calendar.svg" alt="" width="14" height="14"><span>${e.d}</span></p><p><img src="assets/img/icon-location.svg" alt="" width="14" height="14"><span>${e.p}</span></p></span>${PERM ? `<span class="lk">${fmtDist(dist(e))}</span>` : ''}</span></${on === null ? 'a' : 'button'}>`;
  const sortList = (l) => l.slice().sort((a, b) => PERM ? dist(a) - dist(b) : b.l - a.l);
  const inView = () => { const r = map.getBoundingClientRect(), x0 = PW(); return items.filter((e) => { const p = toScreen(e); return p.x >= x0 && p.x <= r.width && p.y >= 0 && p.y <= r.height - (DESK() ? 0 : 120); }); };
  const VIS = { peek: 86, one: 281, mid: 341 };
  function setSheet(st) {
    sheetState = st;
    sheet.classList.toggle('full', st === 'full');
    const vis = st === 'full' ? H - 120 : VIS[st];
    document.documentElement.style.setProperty('--vis', vis + 'px');
  }
  function renderSheet() {
    sheet.classList.remove('nt');
    let html = '';
    if (sel && sel.t === 'ex' && sel.via === 'pin') {
      const e = byId.get(sel.id);
      ttl.textContent = '선택한 전시'; sheet.classList.add('nt');
      html = card(e, null) + `<a class="cta" href="exhibition.html">전시 보러가기</a><button type="button" class="more" id="all">이 지역 전시 ${inView().length}개 보기</button>`;
      setSheet('one');
    } else if (sel && sel.t === 'cl') {
      const g = groups.find((x) => x.ids.join(',') === sel.key);
      const l = g ? sortList(g.list) : [];
      ttl.textContent = `여기 모인 전시 ${l.length}개`;   // ❓ 임시 문구
      html = l.map((e) => card(e, false)).join('');
      if (sheetState === 'one' || sheetState === 'peek') setSheet('mid');
    } else {
      const l = sortList(inView());
      ttl.textContent = `이 지역 전시 ${l.length}개`;
      html = l.length ? l.map((e) => card(e, !!(sel && sel.t === 'ex' && sel.id === e.i))).join('') : '<p class="empty">이 지역에 보여줄 전시가 없어요</p>';
      if (sheetState === 'one') setSheet('mid');
    }
    bodyEl.innerHTML = html;
    if (!DESK()) bodyEl.scrollTop = 0;
  }
  const refresh = () => {
    renderPins(); renderSheet();
    for (const c of document.querySelectorAll('.chip')) c.setAttribute('aria-pressed', String(fl.has(c.dataset.f)));
    $('n-live').textContent = ALL.filter((e) => e.st === '전시 중' && qOk(e)).length;
    $('n-soon').textContent = ALL.filter((e) => e.st === '전시 예정' && qOk(e)).length;
  };

  /* ---- 움직이기 (부드럽게 이동) ---- */
  let anim = 0;
  function flyTo(wx, wy, ns, dy = 0) {
    anim++;
    const my = anim;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fs = s, fx = cx, fy = cy; const tsc = ns || s;
    const tcy = wy + dy / tsc;
    const t0 = performance.now(), D = reduce ? 1 : 380;
    const zoomChanged = tsc !== fs;
    const step = (t) => {
      if (my !== anim) return;
      const k = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - k, 3);
      s = fs + (tsc - fs) * e; cx = fx + (wx - fx) * e; cy = fy + (tcy - fy) * e;
      if (zoomChanged) renderPins(); else applyTransform();
      if (k < 1) next(); else { renderPins(); renderSheet(); }
    };
    const next = () => { let done = false; const go = () => { if (done) return; done = true; step(performance.now()); }; requestAnimationFrame(go); setTimeout(go, 34); };   // 화면이 가려져 있어도 끝까지 가도록 타이머 보조
    next();
  }
  const focusDy = () => DESK() ? 0 : -(((H - 341) / 2 + 40) - ((H - 281) / 2));   // 선택한 핀이 시트 위 가운데쯤 오도록

  /* ---- 선택 ---- */
  function selectEx(id, via) {
    const e = byId.get(id); if (!e) return;
    if (folded()) setFold(false, false);   // 접힌 상태에서 전시를 고르면 정보가 보이도록 패널을 다시 펼침
    sel = { t: 'ex', id, via };
    // 핀이 묶음 안에 있으면 풀릴 때까지 확대
    let ns = s; while (ns < 2.5) { const mates = items.some((f) => f.i !== id && Math.hypot((e.x - f.x) * ns, (e.y - f.y) * ns) < 40); if (!mates) break; ns = Math.min(2.5, ns * 1.35); }
    if (via === 'pin') setSheet('one'); else if (sheetState === 'full' || sheetState === 'peek' || sheetState === 'one') setSheet('mid');
    flyTo(e.x, e.y, ns, via === 'pin' ? focusDy() : (DESK() ? 0 : -(((H - 341) / 2 + 40) - ((H - 341) / 2))));
    renderPins(); renderSheet();
  }
  function selectCl(key) {
    const g = groups.find((x) => x.ids.join(',') === key); if (!g) return;
    if (folded()) setFold(false, false);
    sel = { t: 'cl', ids: g.ids, key };
    setSheet('mid'); renderPins(); renderSheet();
  }
  function clear() { if (!sel) return; sel = null; if (sheetState === 'one') setSheet('mid'); renderPins(); renderSheet(); }

  /* ---- 입력: 끌기·핀치·휠 ---- */
  const ptr = new Map(); let dragged = false, start = null, pinch0 = null;
  map.addEventListener('pointerdown', (ev) => {
    anim++;
    ptr.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptr.size === 1) { dragged = false; start = { x: ev.clientX, y: ev.clientY, cx, cy }; }
    if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), s }; dragged = true; }
  });
  addEventListener('pointermove', (ev) => {
    if (!ptr.has(ev.pointerId)) return;
    ptr.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    if (ptr.size === 2 && pinch0) {
      const [a, b] = [...ptr.values()]; const ns = Math.min(2.5, Math.max(0.5, pinch0.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d));
      if (Math.abs(ns - s) > 0.01) zoomAt(ns, (a.x + b.x) / 2, (a.y + b.y) / 2, true);
      return;
    }
    if (ptr.size === 1 && start) {
      const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
      if (!dragged && Math.hypot(dx, dy) > 6) { dragged = true; map.classList.add('drag'); }
      if (dragged) { cx = Math.min(WW, Math.max(0, start.cx - dx / s)); cy = Math.min(WH, Math.max(0, start.cy - dy / s)); applyTransform(); }
    }
  });
  const up = (ev) => {
    if (!ptr.has(ev.pointerId)) return; ptr.delete(ev.pointerId); map.classList.remove('drag');
    if (ptr.size < 2) pinch0 = null;
    if (ptr.size === 0 && dragged) { renderSheet(); setTimeout(() => { dragged = false; }, 0); }
  };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  function zoomAt(ns, px, py, live) {
    const wx = (px - tx()) / s, wy = (py - ty()) / s;
    s = ns; cx = wx - (px - vc().x) / s; cy = wy - (py - vc().y) / s;
    cx = Math.min(WW, Math.max(0, cx)); cy = Math.min(WH, Math.max(0, cy));
    renderPins(); if (!live) renderSheet();
  }
  map.addEventListener('wheel', (ev) => { ev.preventDefault(); const ns = Math.min(2.5, Math.max(0.5, s * Math.exp(-ev.deltaY * 0.0018))); zoomAt(ns, ev.clientX, ev.clientY, false); }, { passive: false });
  map.addEventListener('dblclick', (ev) => { if (ev.target.closest('.pin, .cl')) return; zoomAt(Math.min(2.5, s * 1.5), ev.clientX, ev.clientY, false); });
  map.addEventListener('click', (ev) => {
    if (dragged) return;
    const pin = ev.target.closest('.pin'), cl = ev.target.closest('.cl');
    if (pin) selectEx(+pin.dataset.id, 'pin');
    else if (cl) selectCl(cl.dataset.key);
    else clear();
  });
  const zoomBtn = (k) => { const v = vc(); zoomAt(Math.min(2.5, Math.max(0.5, s * k)), v.x, v.y, false); };
  $('zin').onclick = () => zoomBtn(1.4); $('zout').onclick = () => zoomBtn(1 / 1.4);

  /* ---- 시트 안 동작 ---- */
  bodyEl.addEventListener('click', (ev) => {
    if (ev.target.closest('#all')) { clear(); return; }
    const c = ev.target.closest('button.lcard'); if (!c) return;
    const id = +c.dataset.id;
    if (sel && sel.t === 'ex' && sel.id === id && sel.via === 'list') { location.href = 'exhibition.html'; return; }   // 선택된 카드를 한 번 더 누르면 상세로
    selectEx(id, 'list');
  });

  /* 시트 끌어서 접기·펼치기 (폰) */
  const grab = $('grab'); let gs = null;
  const fullH = () => H - 120;
  const visNow = () => sheetState === 'full' ? fullH() : VIS[sheetState];
  grab.addEventListener('pointerdown', (ev) => { if (DESK() || ev.target.closest('button')) return; gs = { y: ev.clientY, vis: visNow(), moved: false }; grab.setPointerCapture(ev.pointerId); sheet.classList.add('dragging'); });
  grab.addEventListener('pointermove', (ev) => { if (!gs) return; const d = gs.y - ev.clientY; if (Math.abs(d) > 4) gs.moved = true; const v = Math.min(fullH(), Math.max(VIS.peek, gs.vis + d)); document.documentElement.style.setProperty('--vis', v + 'px'); gs.cur = v; });
  const gend = () => { if (!gs) return; sheet.classList.remove('dragging'); const g = gs; gs = null;
    if (!g.moved) { cycle(); return; }
    const opts = sel && sel.t === 'ex' && sel.via === 'pin' ? [['peek', VIS.peek], ['one', VIS.one]] : [['peek', VIS.peek], ['mid', VIS.mid], ['full', fullH()]];
    const best = opts.reduce((a, b) => Math.abs(b[1] - g.cur) < Math.abs(a[1] - g.cur) ? b : a);
    setSheet(best[0]); };
  grab.addEventListener('pointerup', gend); grab.addEventListener('pointercancel', gend);
  const cycle = () => { if (DESK()) return; if (sel && sel.t === 'ex' && sel.via === 'pin') setSheet(sheetState === 'peek' ? 'one' : 'peek'); else setSheet(sheetState === 'mid' ? 'full' : sheetState === 'full' ? 'peek' : 'mid'); };
  grab.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); cycle(); } });

  /* ---- 칩·검색·위치·뒤로 ---- */
  $('chips').addEventListener('click', (ev) => {
    const b = ev.target.closest('.chip'); if (!b) return;
    const k = b.dataset.f; if (fl.has(k)) fl.delete(k); else fl.add(k);   // 다시 누르면 해제
    if (sel) { const ids = sel.t === 'ex' ? [sel.id] : sel.ids; if (!ids.some((i) => matches(byId.get(i)))) sel = null; }
    refresh();
  });
  let qt = 0;
  $('q').addEventListener('input', (ev) => {
    query = ev.target.value.replace(/\s/g, '').toLowerCase(); sel = null; refresh();
    clearTimeout(qt); qt = setTimeout(() => { if (query && items.length) fit(items); }, 350);   // 검색하면 결과가 다 보이게 지도가 움직임
  });
  function fit(list) {
    const xs = list.map((e) => e.x), ys = list.map((e) => e.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const vw = DESK() ? W - PW() - 100 : W - 80, vh = DESK() ? H - 200 : H - 341 - 160;
    const ns = list.length === 1 ? Math.max(s, 1.2) : Math.min(2.5, Math.max(0.5, Math.min(vw / Math.max(80, x1 - x0), vh / Math.max(80, y1 - y0))));
    flyTo((x0 + x1) / 2, (y0 + y1) / 2, ns, 0);
  }
  $('loc').onclick = () => {
    if (!PERM) { toast('위치 권한이 꺼져 있어요'); return; }
    locOn = true; $('loc').setAttribute('aria-pressed', 'true'); sel = null; flyTo(ME.x, ME.y, Math.max(s, 1), 0); renderPins(); renderSheet();
  };
  if (!PERM) { $('perm').hidden = false; $('loc').disabled = true; $('loc').setAttribute('aria-label', '내 위치 (위치 권한이 꺼져 있어요)'); }
  $('perm-open').onclick = () => toast('기기 설정에서 위치를 켜주세요 (데모)');
  $('back').addEventListener('click', (ev) => { if (history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin) { ev.preventDefault(); history.back(); } });
  let tt = 0; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; setSheet(sheetState); refresh(); });

  /* ---- 왼쪽 패널 접기/펼치기 (웹) ---- */
  function setFold(on, save) {
    if (on === folded()) return;
    const old = vc(); document.body.classList.toggle('folded', on); const nw = vc();
    cx += (nw.x - old.x) / s;            // 접어도 지도 위치는 그대로(지도는 원래 화면 전체 뒤에 깔려 있음)
    applyTransform();
    const b = $('fold'); b.setAttribute('aria-expanded', String(!on)); b.setAttribute('aria-label', on ? '목록 펼치기' : '목록 접기');
    if (save) { try { localStorage.setItem('du.mapfold', on ? '1' : '0'); } catch (e) {} }
    renderSheet();
  }
  $('fold').onclick = () => setFold(!folded(), true);
  try { if (DESK() && localStorage.getItem('du.mapfold') === '1') setFold(true, false); } catch (e) {}

  /* ---- 시작 ---- */
  setSheet('mid');
  refresh();
  const first = P.get('ex');
  if (first !== null && byId.has(+first)) selectEx(+first, 'pin');
})();
</script>
</body>
